<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TA 관리</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      padding: 24px;
    }
    .red-box {
      border: 4px solid #dc2626;
      border-radius: 16px;
      padding: 50px 70px;
      background-color: #ffffff;
      box-shadow: 0 10px 30px rgba(220, 38, 38, 0.12);
      text-align: center;
      max-width: 95%;
      word-break: keep-all;
    }
    .red-box .message {
      font-size: 28pt;
      font-weight: bold;
      color: #dc2626;
      line-height: 1.4;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>
  <div class="red-box">
    <div class="message">TA 관리는 각자 잘 해 주세요</div>
  </div>
</body>
</html>
