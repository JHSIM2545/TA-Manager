<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1f3f">
<title>에스원 북서울지사 영업 TA 관리</title>
<!-- Supabase JS Client v2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0b1f3f;
    --navy2: #132a52;
    --navy3: #1c3a6e;
    --blue: #2563eb;
    --blue-light: #eaf1ff;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --border: #e3e8f0;
    --card: #ffffff;
    --bg: #f4f6fb;
    --text: #1a2333;
    --muted: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  }

  /* ========== 공통 헤더 ========== */
  header.topbar {
    background: linear-gradient(135deg, var(--navy), var(--navy3));
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(10,20,40,.15);
  }
  .brand-title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .user-badge { font-size: 11.5px; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 999px; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .topbar-date-info { font-size: 12px; opacity: .9; text-align: right; }
  .btn-logout { background: rgba(255,255,255,.15); border: none; color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 11.5px; cursor: pointer; font-weight: 700; }

  /* ========== 레이아웃 ========== */
  main.app-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 18px 18px 80px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(10,20,40,.04);
  }
  .panel h2, .panel h3 { margin: 0 0 14px; font-size: 16px; color: var(--navy); }

  /* KPI 그리드 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .kpi-card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi-card .value { font-size: 18px; font-weight: 800; color: var(--navy); }
  .kpi-card .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* 금일 수주예정 박스 */
  .today-box {
    background: linear-gradient(135deg, var(--navy), #123566);
    color: #fff;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .today-box .val { font-size: 24px; font-weight: 900; color: #fde047; margin-top: 4px; }
  .btn-today-detail {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 카테고리 / 단계 필터 칩 */
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .filter-chip {
    flex: none;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
  }
  .filter-chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* 테이블 & 리스트 */
  .table-scroll { max-height: 520px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table thead tr { background: var(--navy); color: #fff; }
  table.data-table th { padding: 10px 8px; text-align: left; font-size: 12px; position: sticky; top: 0; z-index: 2; }
  table.data-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data-table tbody tr:hover { background: #eef3fb; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.prog { background: #dbeafe; color: #2563eb; }
  .badge.won { background: #dcfce7; color: #16a34a; }
  .badge.lost { background: #fee2e2; color: #dc2626; }
  .amount-cell { font-weight: 700; color: var(--navy); white-space: nowrap; }

  /* 모바일 카드 뷰 (모바일에서 테이블 대신 활성화) */
  .lead-card-list { display: none; }
  .m-lead-card {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .m-lead-card.won { border-left-color: var(--green); }
  .m-lead-card.lost { border-left-color: var(--red); }
  .m-lead-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .m-lead-company { font-size: 14.5px; font-weight: 800; color: var(--navy); }
  .m-lead-amount { font-size: 15px; font-weight: 800; color: var(--text); }
  .m-lead-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }

  /* 폼 스타일 */
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fafbfd;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--blue);
    background: #fff;
  }
  button.btn-primary { background: var(--blue); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.btn-secondary { background: #eef1f7; color: var(--navy); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* 모달 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,20,40,.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 16px;
    max-width: 650px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
  }

  /* ========== 모바일 최적화 미디어 쿼리 (< 820px) ========== */
  .m-tabbar { display: none; }
  @media (max-width: 820px) {
    main.app-container { padding: 12px 12px 85px; }
    .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .today-box { flex-direction: column; align-items: stretch; gap: 12px; text-align: center; }
    .form-grid { grid-template-columns: 1fr; gap: 0; }
    .desktop-table-view { display: none; }
    .lead-card-list { display: block; }
    
    .m-tabbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: #fff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 10px rgba(10,20,40,.08);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .m-tab-btn {
      flex: 1;
      border: none;
      background: none;
      padding: 9px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .m-tab-btn.active { color: var(--navy); font-weight: 800; }
    .m-tab-icon { font-size: 18px; line-height: 1; }
  }

  /* 로그인 화면 */
  #loginOverlay {
    position: fixed;
    inset: 0;
    background: #f4f6fb;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    padding: 34px 28px;
    box-shadow: 0 4px 24px rgba(20,40,80,.12);
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 { font-size: 19px; margin: 0 0 6px; color: var(--navy); text-align: center; }
  .login-card p { font-size: 13px; color: var(--muted); margin: 0 0 22px; text-align: center; }
</style>
</head>
<body>

<!-- 1. 로그인 화면 -->
<div id="loginOverlay">
  <div class="login-card">
    <h1>S1 북서울지사 영업 TA</h1>
    <p>전화번호와 비밀번호를 입력해주세요.</p>
    <div class="form-group">
      <label>전화번호</label>
      <input id="loginPhone" type="tel" placeholder="01012345678" autocomplete="tel">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input id="loginPw" type="password" autocomplete="current-password">
    </div>
    <button type="button" id="btnLogin" class="btn-primary" style="width:100%; margin-top:10px;">로그인</button>
    <div id="loginMsg" style="margin-top:12px; font-size:12.5px; text-align:center; min-height:16px;"></div>
  </div>
</div>

<!-- 2. 메인 애플리케이션 -->
<div id="appRoot" style="display:none;">
  <header class="topbar">
    <div class="brand-title">
      <span>에스원 북서울지사</span>
      <span class="user-badge" id="userBadge">로그인</span>
    </div>
    <div class="top-right">
      <div class="topbar-date-info">
        <div id="todayDateStr" style="font-weight:700;"></div>
        <div id="workingDaysStr" style="opacity:.8;"></div>
      </div>
      <button type="button" class="btn-logout" id="btnLogout">로그아웃</button>
    </div>
  </header>

  <main class="app-container">
    <!-- 상단 상품 카테고리 필터 -->
    <div class="filter-row" id="categoryFilterRow">
      <button type="button" class="filter-chip active" data-category="all">전체 상품</button>
      <button type="button" class="filter-chip" data-category="일반알람">일반알람</button>
      <button type="button" class="filter-chip" data-category="디지털(정보보안)">디지털(정보보안)</button>
      <button type="button" class="filter-chip" data-category="안전상품">안전상품</button>
    </div>

    <!-- 금일 수주 예정 배너 -->
    <div class="today-box">
      <div>
        <div style="font-size:13px; opacity:.9;" id="todayBoxTitle">금일 수주 예정 금액</div>
        <div class="val" id="todayExpectedAmount">0원 (0건)</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-today-detail" id="btnTodayDetail">상세리스트</button>
        <button type="button" class="btn-today-detail" id="btnCopyToday" style="background:#16a34a; display:none;">공지 복사</button>
      </div>
    </div>

    <!-- ==================== 지사장 전용 뷰 ==================== -->
    <div id="masterSection" style="display:none;">
      <!-- KPI 종합 현황 -->
      <div class="panel">
        <h2>지사 전체 TA 종합 현황 <span id="currentMonthStr" style="font-size:12px; color:var(--muted); font-weight:normal;"></span></h2>
        <div class="kpi-grid">
          <div class="kpi-card"><div class="label">전체 TA</div><div class="value" id="mKpiTotalAmt">0원</div><div class="sub" id="mKpiTotalCnt">0건</div></div>
          <div class="kpi-card"><div class="label">진행중 TA</div><div class="value" id="mKpiPipeAmt">0원</div><div class="sub" id="mKpiPipeCnt">0건</div></div>
          <div class="kpi-card"><div class="label">이달 수주 TA</div><div class="value" id="mKpiWonAmt">0원</div><div class="sub" id="mKpiWonCnt">0건</div></div>
          <div class="kpi-card"><div class="label">실패 TA</div><div class="value" id="mKpiFailAmt">0원</div><div class="sub" id="mKpiFailCnt">0건</div></div>
          <div class="kpi-card"><div class="label">수주 달성율</div><div class="value" id="mKpiAchieveRate">-</div><div class="sub" id="mKpiAchieveSub"></div></div>
          <div class="kpi-card"><div class="label">보유 TA율</div><div class="value" id="mKpiHoldRate">-</div><div class="sub" id="mKpiHoldSub"></div></div>
          <div class="kpi-card"><div class="label">TA 수주율</div><div class="value" id="mKpiWinRate">-</div><div class="sub" id="mKpiWinSub"></div></div>
          <div class="kpi-card"><div class="label">수주 실패율</div><div class="value" id="mKpiFailRate">-</div><div class="sub" id="mKpiFailSub"></div></div>
        </div>
      </div>

      <!-- 컨설턴트별 목표 관리 & 실적 랭킹 -->
      <div class="panel">
        <h2>컨설턴트별 실적 랭킹 및 목표 관리</h2>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>순위</th><th>컨설턴트</th><th>이달 수주</th><th>진행중 TA</th><th>수주 달성율</th><th>이달 목표 설정(원)</th><th>저장</th>
              </tr>
            </thead>
            <tbody id="masterTargetTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ==================== 전체/내 TA 목록 (공통) ==================== -->
    <div class="panel">
      <h2>TA 목록 (<span id="totalListCount">0</span>건)</h2>
      <div class="filter-row" id="stageFilterRow">
        <button type="button" class="filter-chip active" data-stage="all">전체 단계</button>
        <button type="button" class="filter-chip" data-stage="진행중">진행중</button>
        <button type="button" class="filter-chip" data-stage="수주完">수주完</button>
        <button type="button" class="filter-chip" data-stage="실패">실패</button>
      </div>
      
      <!-- PC 테이블 뷰 -->
      <div class="desktop-table-view table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>컨설턴트</th><th>서비스제공처명</th><th>고객담당자</th><th>금액</th><th>단계</th><th>확도</th><th>상품</th><th>예정일</th><th>기산일</th><th>메모</th>
            </tr>
          </thead>
          <tbody id="leadTableTbody"></tbody>
        </table>
      </div>

      <!-- 모바일 카드 뷰 -->
      <div class="lead-card-list" id="leadCardList"></div>
    </div>
  </main>
</div>

<!-- 상세 팝업 모달 -->
<div class="modal-overlay" id="commonModal">
  <div class="modal-box">
    <h3 id="modalTitle">금일 수주 예정 상세</h3>
    <div id="modalContent" style="margin-top:12px; font-size:13.5px; line-height:1.6;"></div>
    <div style="margin-top:20px; text-align:right;">
      <button type="button" class="btn-secondary" id="btnModalClose">닫기</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// Supabase 설정 및 초기화
// ==========================================
const SUPABASE_URL = 'https://gpqlximhoqdybcewdfde.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xUnGxyLCc5TB5nv4keVQVw__grqGJkP';

window.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const db = window.supabase;

// 앱 전역 상태
let currentUser = null;
let allLeads = [];
let allTargets = {};
let activeCategory = 'all';
let activeStage = 'all';

function formatCurrency(n) {
  return (Number(n) || 0).toLocaleString('ko-KR') + '원';
}

function getTodayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function getCurrentMonthStr() {
  return getTodayStr().slice(0, 7);
}

function productCategory(productType) {
  if (productType === '정보보안') return '디지털(정보보안)';
  if (productType === '안전상품') return '안전상품';
  return '일반알람';
}

function getFilteredLeads() {
  return allLeads.filter(l => {
    if (activeCategory !== 'all' && productCategory(l.product_type) !== activeCategory) return false;
    return true;
  });
}

// SHA-256 비밀번호 해시 계산
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ==========================================
// 로그인 이벤트 및 인증
// ==========================================
document.getElementById('loginPhone').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginPw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('btnLogin').addEventListener('click', doLogin);

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.replace(/[^0-9]/g, '');
  const pw = document.getElementById('loginPw').value;
  const msgEl = document.getElementById('loginMsg');
  
  if (!phone || !pw) {
    msgEl.textContent = '전화번호와 비밀번호를 모두 입력하세요.';
    msgEl.style.color = 'var(--red)';
    return;
  }
  msgEl.textContent = '확인 중...';
  msgEl.style.color = 'var(--navy)';

  try {
    const pwHash = await sha256(pw);
    const { data: users, error } = await db
      .from('app_users')
      .select('name, job, hash, phone')
      .eq('phone', phone)
      .limit(1);

    if (error || !users || users.length === 0) {
      msgEl.textContent = '등록되지 않은 사용자입니다.';
      msgEl.style.color = 'var(--red)';
      return;
    }
    const user = users[0];
    if (user.hash.toLowerCase() !== pwHash.toLowerCase()) {
      msgEl.textContent = '비밀번호가 일치하지 않습니다.';
      msgEl.style.color = 'var(--red)';
      return;
    }

    currentUser = {
      name: user.name,
      phone: user.phone,
      role: (user.job === '지사관리자') ? 'master' : 'consultant'
    };
    sessionStorage.setItem('s1_user', JSON.stringify(currentUser));
    initApp();
  } catch (err) {
    msgEl.textContent = '로그인 오류: ' + err.message;
    msgEl.style.color = 'var(--red)';
  }
}

document.getElementById('btnLogout').addEventListener('click', () => {
  sessionStorage.removeItem('s1_user');
  location.reload();
});

// ==========================================
// 데이터 로드 및 렌더링
// ==========================================
async function initApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';

  document.getElementById('userBadge').textContent = `${currentUser.name} (${currentUser.role === 'master' ? '지사장' : '컨설턴트'})`;
  document.getElementById('todayDateStr').textContent = getTodayStr();
  document.getElementById('currentMonthStr').textContent = `(${getCurrentMonthStr()})`;

  if (currentUser.role === 'master') {
    document.getElementById('masterSection').style.display = 'block';
    document.getElementById('btnCopyToday').style.display = 'inline-block';
  }

  await Promise.all([loadLeads(), loadTargets()]);
  render();
}

async function loadLeads() {
  const query = db.from('ta_leads').select('*').order('created_at', { ascending: false });
  if (currentUser.role === 'consultant') {
    query.eq('consultant', currentUser.name);
  }
  const { data, error } = await query;
  if (!error && data) allLeads = data;
}

async function loadTargets() {
  const month = getCurrentMonthStr();
  const { data, error } = await db.from('targets').select('*').eq('target_month', month);
  if (!error && data) {
    allTargets = {};
    data.forEach(t => { allTargets[t.consultant] = Number(t.target_amount || 0); });
  }
}

function render() {
  renderTodayBanner();
  renderKPI();
  renderLeadList();
  if (currentUser.role === 'master') {
    renderMasterTargets();
  }
}

function renderTodayBanner() {
  const today = getTodayStr();
  const leads = getFilteredLeads();
  const todayLeads = leads.filter(l => l.expected_date === today);
  const totalAmt = todayLeads.reduce((s, l) => s + Number(l.amount || 0), 0);
  document.getElementById('todayExpectedAmount').textContent = `${formatCurrency(totalAmt)} (${todayLeads.length}건)`;
}

function renderKPI() {
  const month = getCurrentMonthStr();
  const leads = getFilteredLeads();
  
  const totalAmt = leads.reduce((s, l) => s + Number(l.amount || 0), 0);
  const pipeLeads = leads.filter(l => l.stage === '진행중');
  const wonLeads = leads.filter(l => l.stage === '수주完' && (l.contract_date || '').slice(0, 7) === month);
  const failLeads = leads.filter(l => l.stage === '실패');

  const pipeAmt = pipeLeads.reduce((s, l) => s + Number(l.amount || 0), 0);
  const wonAmt = wonLeads.reduce((s, l) => s + Number(l.amount || 0), 0);
  const failAmt = failLeads.reduce((s, l) => s + Number(l.amount || 0), 0);

  // 누적 수주 금액
  const wonAllLeads = leads.filter(l => l.stage === '수주完');
  const wonAllAmt = wonAllLeads.reduce((s, l) => s + Number(l.amount || 0), 0);

  // 이달 수주 예정인 진행중 건
  const monthPipeLeads = pipeLeads.filter(l => (l.expected_date || '').slice(0, 7) === month);
  const monthPipeAmt = monthPipeLeads.reduce((s, l) => s + Number(l.amount || 0), 0);

  if (currentUser.role === 'master') {
    // 1. 기본 건수 및 금액
    document.getElementById('mKpiTotalAmt').textContent = formatCurrency(totalAmt);
    document.getElementById('mKpiTotalCnt').textContent = leads.length + '건';
    document.getElementById('mKpiPipeAmt').textContent = formatCurrency(pipeAmt);
    document.getElementById('mKpiPipeCnt').textContent = pipeLeads.length + '건';
    document.getElementById('mKpiWonAmt').textContent = formatCurrency(wonAmt);
    document.getElementById('mKpiWonCnt').textContent = wonLeads.length + '건';
    document.getElementById('mKpiFailAmt').textContent = formatCurrency(failAmt);
    document.getElementById('mKpiFailCnt').textContent = failLeads.length + '건';

    // 2. 전체 목표 합산
    let totalTarget = 0;
    Object.values(allTargets).forEach(v => { totalTarget += Number(v || 0); });

    // 수주 달성율
    const achieveRate = totalTarget > 0 ? (Math.round(wonAmt / totalTarget * 1000) / 10) + '%' : '목표 미설정';
    document.getElementById('mKpiAchieveRate').textContent = achieveRate;
    document.getElementById('mKpiAchieveSub').textContent = totalTarget > 0 ? '목표 ' + formatCurrency(totalTarget) : '아래 목표란에서 입력';

    // 보유 TA율
    const holdRate = totalTarget > 0 ? (Math.round(monthPipeAmt / totalTarget * 1000) / 10) + '%' : '-';
    document.getElementById('mKpiHoldRate').textContent = holdRate;
    document.getElementById('mKpiHoldSub').textContent = totalTarget > 0 ? '이달 예정 ' + formatCurrency(monthPipeAmt) + ' (' + monthPipeLeads.length + '건)' : '';

    // TA 수주율
    const winRate = totalAmt > 0 ? (Math.round(wonAllAmt / totalAmt * 1000) / 10) + '%' : '-';
    document.getElementById('mKpiWinRate').textContent = winRate;
    document.getElementById('mKpiWinSub').textContent = '누적 수주 ' + formatCurrency(wonAllAmt);

    // 수주 실패율
    const failRate = totalAmt > 0 ? (Math.round(failAmt / totalAmt * 1000) / 10) + '%' : '-';
    document.getElementById('mKpiFailRate').textContent = failRate;
    document.getElementById('mKpiFailSub').textContent = '실패 ' + formatCurrency(failAmt);
  }
}

function renderLeadList() {
  let list = getFilteredLeads().filter(l => {
    if (activeStage !== 'all' && l.stage !== activeStage) return false;
    return true;
  });
  document.getElementById('totalListCount').textContent = list.length;

  const tbody = document.getElementById('leadTableTbody');
  tbody.innerHTML = list.map(l => `
    <tr>
      <td style="font-weight:700;">${l.consultant}</td>
      <td style="font-weight:700;">${l.company}</td>
      <td>${l.contact || '-'}</td>
      <td class="amount-cell">${formatCurrency(l.amount)}</td>
      <td><span class="badge ${l.stage==='진행중'?'prog':(l.stage==='수주完'?'won':'lost')}">${l.stage}</span></td>
      <td>${l.confidence}</td>
      <td>${l.product_type}</td>
      <td>${l.expected_date || '-'}</td>
      <td>${l.base_date || '-'}</td>
      <td>${l.memo || ''}</td>
    </tr>
  `).join('');

  const cardContainer = document.getElementById('leadCardList');
  cardContainer.innerHTML = list.map(l => `
    <div class="m-lead-card ${l.stage==='수주完'?'won':(l.stage==='실패'?'lost':'')}">
      <div class="m-lead-top">
        <div class="m-lead-company">${l.company}</div>
        <div class="m-lead-amount">${formatCurrency(l.amount)}</div>
      </div>
      <div class="m-lead-meta">
        <span class="badge ${l.stage==='진행중'?'prog':(l.stage==='수주完'?'won':'lost')}">${l.stage}</span>
        <span>확도 ${l.confidence}</span>
        <span>${l.product_type}</span>
        <span>예정 ${l.expected_date || '-'}</span>
      </div>
    </div>
  `).join('');
}

function renderMasterTargets() {
  const consultants = ['최영국', '박광춘', '이수열', '정문재', '임영민'];
  const month = getCurrentMonthStr();
  const tbody = document.getElementById('masterTargetTbody');

  tbody.innerHTML = consultants.map((name, i) => {
    const leads = allLeads.filter(l => l.consultant === name);
    const wonAmt = leads.filter(l => l.stage === '수주完' && (l.contract_date||'').slice(0,7) === month).reduce((s,l)=>s+Number(l.amount||0), 0);
    const pipeAmt = leads.filter(l => l.stage === '진행중').reduce((s,l)=>s+Number(l.amount||0), 0);
    const target = allTargets[name] || 0;
    const rate = target > 0 ? (Math.round(wonAmt / target * 1000) / 10) + '%' : '-';

    return `
      <tr>
        <td>${i + 1}</td>
        <td style="font-weight:700;">${name}</td>
        <td>${formatCurrency(wonAmt)}</td>
        <td>${formatCurrency(pipeAmt)}</td>
        <td style="font-weight:700;">${rate}</td>
        <td><input type="number" id="targetInput_${name}" value="${target}" style="width:130px; padding:6px 8px; border:1px solid var(--border); border-radius:6px;"></td>
        <td><button type="button" class="btn-primary" onclick="saveTarget('${name}')" style="padding:6px 12px; font-size:12px;">저장</button></td>
      </tr>
    `;
  }).join('');
}

async function saveTarget(name) {
  const val = Number(document.getElementById(`targetInput_${name}`).value) || 0;
  const month = getCurrentMonthStr();
  const { error } = await db.from('targets').upsert({
    consultant: name,
    target_month: month,
    target_amount: val,
    updated_at: new Date().toISOString()
  }, { onConflict: 'consultant,target_month' });

  if (error) alert('목표 저장 실패: ' + error.message);
  else {
    allTargets[name] = val;
    alert(`${name} 컨설턴트 목표가 저장되었습니다.`);
    render();
  }
}

// 필터 이벤트 리스너
document.querySelectorAll('#categoryFilterRow .filter-chip').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#categoryFilterRow .filter-chip').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeCategory = this.getAttribute('data-category');
    render();
  });
});

document.querySelectorAll('#stageFilterRow .filter-chip').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#stageFilterRow .filter-chip').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeStage = this.getAttribute('data-stage');
    renderLeadList();
  });
});

// 모달 안내
document.getElementById('btnTodayDetail').addEventListener('click', () => {
  const today = getTodayStr();
  const todayLeads = getFilteredLeads().filter(l => l.expected_date === today);
  const content = todayLeads.length === 0 ? '금일 수주 예정인 TA가 없습니다.' : todayLeads.map(l => `
    <div style="border-bottom:1px solid #eee; padding:8px 0;">
      <strong>${l.consultant}</strong> · ${l.company} · <strong>${formatCurrency(l.amount)}</strong> (확도 ${l.confidence})
    </div>
  `).join('');
  document.getElementById('modalContent').innerHTML = content;
  document.getElementById('commonModal').classList.add('show');
});

document.getElementById('btnModalClose').addEventListener('click', () => {
  document.getElementById('commonModal').classList.remove('show');
});

// 자동 세션 복구
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('s1_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    initApp();
  }
});
</script>
