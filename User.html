 price: ['계약번호','계약처명','영업담당','접수자','담당차량','접수일','기산일','금액','現용역료','인상인하율','사유','상품','그로스','비고'],  
  productdaily: ['계약번호','서비스제공처','보고일','계약담당자','매출예상','계약동기','계약설치비','계약기기비','합계','구분','매출여부']  
};  
  
/** 셀 값을 클립보드용 텍스트로 변환: 탭/개행이 섞여 들어가면 열이 밀어지므로 공백으로 치환 */  
function copyCellText_(v){  
 if (v === null || v === undefined) return '';  
 return String(v).replace(/\t/g, ' ').replace(/\r?\n/g, ' ');  
}  
  
/** navigator.clipboard가 막혀있는 환경(구글 앱스스크립트 iframe 등)을 위한 폴백 복사 */  
function copyTextFallback_(text){  
 const ta = document.createElement('textarea');  
 ta.value = text;  
 ta.style.position = 'fixed';  
 ta.style.left = '-9999px';  
 ta.style.top = '0';  
 document.body.appendChild(ta);  
 ta.focus();  
 ta.select();  
 let ok = false;  
 try { ok = document.execCommand('copy'); } catch (e) { ok = false; }  
 document.body.removeChild(ta);  
 return ok;  
}  
  
/** scope에 해당하는 전체 컬럼 헤더 배열(화면에 표시되는 실제 순서) 반환 */  
function scopeHeadersArr_(scope){  
 if (scope === 'order') return HEADERS;  
 if (scope === 'cancel') return CANCEL_HEADERS;  
 if (scope === 'price') return PRICE_HEADERS;  
 if (scope === 'restart') return RESTART_HEADERS;  
 return [];  
}  
  
/** 깃발로 선택된 행을 엑셀에 그대로 붙여넣을 수 있는 탭 구분 텍스트로 클립보드에 저장.  
 * 주의: row 객체의 필드 값이 아니라, 현재 화면(표)에 실제로 렌더링된 <td> 내용을 그대로 읽어온다.  
 * (시트 원본 데이터의 열 배치가 어긋나 있어도, 최소한 화면에 보이는 값과 항상 100% 일치하도록 하기 위함) */  
function copyFlaggedRowsToClipboard(scope){  
 let allRows;  
 if (scope === 'order') allRows = sortedRows();  
 else if (scope === 'cancel') allRows = sortedCancelRows();  
 else if (scope === 'price') allRows = sortedPriceRows();  
 else if (scope === 'restart') allRows = sortedRestartRows();  
 else return;  
  
 const flaggedRows = allRows.filter(r => FLAGGED_SET.has(r.id));  
 if (!flaggedRows.length) { alert('선택된(깃발이 체크된) 항목이 없습니다.'); return; }  
  
 const gridWrap = document.querySelector('.grid-wrap');  
 const table = gridWrap ? gridWrap.querySelector('table') : null;  
 if (!table) { alert('표를 찾을 수 없습니다. 화면을 새로고침한 뒤 다시 시도해주세요.'); return; }  
  
 const headersArr = scopeHeadersArr_(scope);  
 const fieldNames = COPY_COLUMNS_[scope];  
 // 실제 <tr> 안에서의 셀 인덱스: 0번 칸은 깃발 체크박스 칸이므로 데이터 컬럼은 +1부터 시작  
 const colIdxList = fieldNames.map(f => headersArr.indexOf(f) + 1).filter(i => i > 0);  
  
 const lines = [];  
 flaggedRows.forEach(row => {  
 const tr = table.querySelector('tr[data-id="' + row.id + '"]');  
 if (!tr) return; // 검색/필터 등으로 현재 화면에 표시되지 않는 행은 건너뜀(화면에 보이는 것만 복사)  
 const trClone = tr.cloneNode(true);  
 Array.from(trClone.querySelectorAll('td')).forEach(td => normalizeCellForOutput_(td));  
 const tds = trClone.querySelectorAll('td');  
 const values = colIdxList.map(idx => copyCellText_(tds[idx] ? tds[idx].textContent : ''));  
 lines.push(values.join('\t'));  
 });  
  
 if (!lines.length) { alert('선택된 항목이 현재 화면에 표시되어 있지 않습니다. 검색어/필터를 확인한 뒤 다시 시도해주세요.'); return; }  
  
 const text = lines.join('\n');  
 const done = () => alert('선택된 ' + lines.length + '건이 복사되었습니다. 엑셀에 붙여넣을 수 있습니다.');  
 const fail = () => {  
 if (copyTextFallback_(text)) done();  
 else alert('클립보드 복사에 실패했습니다. 브라우저 권한을 확인해주세요.');  
 };  
  
 if (navigator.clipboard && navigator.clipboard.writeText) {  
 navigator.clipboard.writeText(text).then(done).catch(fail);  
 } else {  
 fail();  
 }  
}  
  
/* ---- 열 너비 조절 및 로컬 스토리지 기억 로직 ---- */  
let resizeState = { active: false, th: null, startX: 0, startW: 0, tab: '', col: '' };  
function initColResize(e, tab, col) {  
 resizeState = { active: true, th: e.target.closest('th'), startX: e.pageX, startW: e.target.closest('th').offsetWidth, tab: tab, col: col };  
 document.addEventListener('mousemove', onColResize);  
 document.addEventListener('mouseup', endColResize);  
 e.preventDefault();  
}  
function onColResize(e) {  
 if (!resizeState.active) return;  
 const newW = Math.max(30, resizeState.startW + (e.pageX - resizeState.startX));  
 resizeState.th.style.width = newW + 'px';  
 resizeState.th.style.minWidth = newW + 'px';  
}  
function endColResize(e) {  
 if (!resizeState.active) return;  
 resizeState.active = false;  
 localStorage.setItem('colw_' + resizeState.tab + '_' + resizeState.col, resizeState.th.offsetWidth);  
 document.removeEventListener('mousemove', onColResize);  
 document.removeEventListener('mouseup', endColResize);  
}  
  
/* ---- 그리드 날짜 셀(편집형): M/D로 보여주고 포커스 시 원본(YYYY-MM-DD) 표시 ---- */  
const DATE_CELL_HANDLERS = {};  
function dateCellInputHtml(scope, id, field, val){  
  const raw = String(val === null || val === undefined ? '' : val).trim();  
  return '<span class="datecell-wrap" style="position:relative; display:inline-flex; align-items:center; width:100%;">' +  
    '<input type="text" style="text-align:right; width:100%; cursor:pointer;" value="' + escAttr(fmtMD(raw)) + '" data-raw="' + escAttr(raw) + '"' +  
    ' title="' + escAttr(raw) + '"' +  
    ' onfocus="this.value=this.dataset.raw||\'\';this.select();"' +  
    ' onclick="openDateCellPicker_(this)"' +  
    ' onblur="onDateCellBlur(this,\'' + scope + '\',\'' + id + '\',\'' + field + '\')">' +  
    '<input type="date" class="date-pick-hidden"' +  
    ' data-scope="' + scope + '" data-id="' + id + '" data-field="' + field + '"' +  
    ' onchange="onDatePickerChange_(this)">' +  
    '</span>';  
}  
function openDateCellPicker_(textEl) {  
  const wrap = textEl.closest('.datecell-wrap');  
  if (!wrap) return;  
  const hiddenEl = wrap.querySelector('input[type="date"]');  
  if (!hiddenEl) return;  
  const raw = (textEl && textEl.dataset.raw) || '';  
  hiddenEl.value = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : '';  
  if (typeof hiddenEl.showPicker === 'function') {  
    try {  
      hiddenEl.showPicker();  
      return;  
    } catch(e) {}  
  }  
}  
function onDateCellBlur(el, scope, id, field){  
  const raw = el.dataset.raw || '';  
  const typed = String(el.value || '').trim();  
  if (typed === raw || (typed && typed === fmtMD(raw))) {  
    el.value = (raw === '미정' || raw === '해약방어') ? raw : fmtMD(raw);  
    return;  
  }  
  if (!typed) {  
    let parsed = '';  
    if ((scope === 'order' && field === '기산일') ||  
        (scope === 'restart' && field === '재개시일') ||  
        (scope === 'cancel' && field === '확정일') ||  
        (scope === 'price' && field === '기산일')) {  
      parsed = '미정';  
    }  
    el.dataset.raw = parsed;  
    el.value = parsed ? parsed : '';  
    el.title = parsed;  
    const fn = DATE_CELL_HANDLERS[scope];  
    if (fn) fn(id, field, parsed);  
    return;  
  }  
  const parsed = parseDateInput(typed);  
  if (parsed === null) {  
    alert('날짜는 YYYY-MM-DD 또는 M/D 형식으로 입력하세요. ("미정" 등 지정어는 그대로 입력 가능)');  
    el.value = (raw === '미정' || raw === '해약방어') ? raw : fmtMD(raw);  
    return;  
  }  
  el.dataset.raw = parsed;  
  el.value = (parsed === '미정' || parsed === '해약방어') ? parsed : fmtMD(parsed);  
  el.title = parsed;  
  const fn = DATE_CELL_HANDLERS[scope];  
  if (fn) fn(id, field, parsed);  
}  
function onDatePickerChange_(hiddenEl){  
  const wrap = hiddenEl.closest('.datecell-wrap');  
  if (!wrap) return;  
  const textEl = wrap.querySelector('input[type="text"]');  
  const scope = hiddenEl.dataset.scope, id = hiddenEl.dataset.id, field = hiddenEl.dataset.field;  
  let parsed = hiddenEl.value;  
  if (!parsed) {  
    if ((scope === 'order' && field === '기산일') ||  
        (scope === 'restart' && field === '재개시일') ||  
        (scope === 'cancel' && field === '확정일') ||  
        (scope === 'price' && field === '기산일')) {  
      parsed = '미정';  
    } else {  
      parsed = '';  
    }  
  }  
  if (textEl) {  
    textEl.dataset.raw = parsed;  
    textEl.value = (parsed === '미정' || parsed === '해약방어') ? parsed : fmtMD(parsed);  
    textEl.title = parsed;  
  }  
  const fn = DATE_CELL_HANDLERS[scope];  
  if (fn) fn(id, field, parsed);  
}  
  
  

/* ===================== 수정권한 없는 사용자도 날짜만 팝업으로 수정(2026-09-17) =====================  
 * 요청: "수주개시/재개시/해약중지/인상인하 화면의 테이블 날짜를, 화면에서 직접 고치는 게 아니라  
 * 날짜를 클릭하면 팝업이 뜨고 현재 날짜를 보여준 뒤 수정→저장하면 반영되도록 해달라."  
 * 서버의 saveOrderStartRow/saveCancelRow/savePriceRow/saveRestartRow는 원래 편집화면(Admin.html)이  
 * 쓰는 것과 동일한 함수인데, payload.fields에 담긴 항목만 골라 그 칸만 업데이트하므로, 여기서도  
 * 그대로 재사용하면서 날짜 필드 하나만 담아 보낸다(다른 값은 전혀 건드리지 않음). */  
let DATE_EDIT_CTX_ = null; // { scope, id, field }  
const DATE_EDIT_SAVE_FN_ = { order: 'saveOrderStartRow', cancel: 'saveCancelRow', price: 'savePriceRow', restart: 'saveRestartRow' };  
const DATE_EDIT_ROWS_ = { order: function(){ return ROWS; }, cancel: function(){ return CANCEL_ROWS; }, price: function(){ return PRICE_ROWS; }, restart: function(){ return RESTART_ROWS; } };  
const DATE_EDIT_RERENDER_ = { order: render, cancel: renderCancel, price: function(){ ensureUserNames(renderPrice); }, restart: renderRestart };  
/** 날짜 셀(td)을 클릭했을 때 호출 — td의 data-scope/data-id/data-field/data-val 속성을 읽어 팝업을 연다. */  
function openDateEditPopup_(td){  
 if (!SESSION || !SESSION.token) return;  
 const scope = td.dataset.scope, id = td.dataset.id, field = td.dataset.field, raw = td.dataset.val || '';  
 if (!scope || !id || !field) return;  
 DATE_EDIT_CTX_ = { scope: scope, id: id, field: field };  
 document.getElementById('dateEditTitle').innerText = field + ' 수정';  
 document.getElementById('dateEditFieldLabel').innerText = field + ' (현재: ' + (raw || '미정') + ')';  
 const input = document.getElementById('dateEditInput');  
 input.value = raw;  
 document.getElementById('dateEditErr').innerText = '';  
 document.getElementById('dateEditModalOverlay').classList.add('open');  
 setTimeout(function(){ input.focus(); input.select(); }, 0);  
}  
function closeDateEditModal_(){  
 document.getElementById('dateEditModalOverlay').classList.remove('open');  
 DATE_EDIT_CTX_ = null;  
}  
/** 날짜 팝업의 달력 버튼: 투명한 네이티브 <input type="date">를 📅 버튼 위에 완전히 겹쳐 놓고  
 * 실제 클릭은 그 input이 직접 받도록 한다(구글 앱스스크립트가 화면을 샌드박스 iframe 안에서  
 * 띄우는 탓에 showPicker()/click()으로 강제로 여는 방식은 동작하지 않는 경우가 있어, 사용자가  
 * 실제로 그 input을 클릭하게 만드는 방식으로 변경 — 이렇게 해야 브라우저가 확실히 달력을 띄운다).  
 * 클릭(정확히는 달력이 열리기 직전인 mousedown 시점)에 현재 텍스트 입력값으로 달력 시작일을 맞춘다. */  
function syncDateEditCalendarValue_(){  
 const calInput = document.getElementById('dateEditCalendarInput');  
 const textInput = document.getElementById('dateEditInput');  
 const parsed = parseDateInput(String(textInput.value || '').trim());  
 calInput.value = (parsed && /^\d{4}-\d{2}-\d{2}$/.test(parsed)) ? parsed : '';  
}  
/** 달력에서 날짜를 선택하면 보이는 텍스트 입력창에 그대로 반영한다. */  
function onDateEditCalendarChange_(el){  
 if (el.value) { document.getElementById('dateEditInput').value = el.value; }  
}  
function submitDateEdit_(){  
 if (!DATE_EDIT_CTX_) return;  
 const errEl = document.getElementById('dateEditErr');  
 const typed = String(document.getElementById('dateEditInput').value || '').trim();  
 if (!typed) { errEl.innerText = '날짜를 입력하세요.'; return; }  
 const parsed = parseDateInput(typed);  
 if (parsed === null) { errEl.innerText = '날짜는 YYYY-MM-DD 또는 M/D 형식으로 입력하세요. ("미정" 등 지정어는 그대로 입력 가능)'; return; }  
 const ctx = DATE_EDIT_CTX_, fnName = DATE_EDIT_SAVE_FN_[ctx.scope];  
 if (!fnName) return;  
 const payload = { id: ctx.id, fields: {} };  
 payload.fields[ctx.field] = parsed;  
 errEl.innerText = '';  
 const btn = document.getElementById('dateEditSaveBtn');  
 btn.disabled = true; btn.innerText = '저장 중...';  
 google.script.run  
 .withSuccessHandler(function(res){  
 btn.disabled = false; btn.innerText = '저장';  
 if (!res || !res.success) { errEl.innerText = '저장 실패: ' + ((res && res.error) || '알 수 없는 오류'); return; }  
 applyDateEditLocally_(ctx.scope, ctx.id, ctx.field, parsed);  
 closeDateEditModal_(); onDataChanged_(ctx.scope);  
 })  
 .withFailureHandler(function(err){  
 btn.disabled = false; btn.innerText = '저장';  
 errEl.innerText = '통신 오류: ' + String(err);  
 })  
 [fnName](SESSION.token, payload);  
}  
/** 저장 성공 시 서버를 다시 조회하지 않고 화면에 바로 반영(선반영)한다. 다른 화면/다른 사용자에게는  
 * 기존 자동 새로고침 로직(checkSheetFreshness_)이 잠시 후 알아서 최신값을 가져다준다. */  
function applyDateEditLocally_(scope, id, field, newVal){  
 const rowsFn = DATE_EDIT_ROWS_[scope];  
 const rows = rowsFn ? rowsFn() : null;  
 if (rows) {  
 const row = rows.find(function(r){ return r.id === id; });  
 if (row) row[field] = newVal;  
 }  
 if (typeof invalidateScopeCache_ === 'function') invalidateScopeCache_(scope); // 이 화면 자신의 캐시도 최신화(다음 재조회 시 정확)  
 const renderFn = DATE_EDIT_RERENDER_[scope];  
 if (renderFn) renderFn();  
}  
  
  
/* ===================== 로그인 / 세션 ===================== */  
const SESSION_STORAGE_KEY = 's1_session_v1';  
let SESSION = null;  
  
/* ===================== 화면 데이터 브라우저 캐시 (탭 재방문 시 서버 재조회 없이 즉시 표시) ===================== */  
const CLIENT_CACHE_ = {};  
const CLIENT_CACHE_TTL_MS_ = 8 * 60 * 60 * 1000; // Admin.html과 동일하게 8시간으로 확대(탭 전환마다 재조회하지 않도록)  
function cacheGet_(key, ttlMsOverride) {  
 const e = CLIENT_CACHE_[key];  
 if (!e) return null;  
 const ttl = ttlMsOverride || CLIENT_CACHE_TTL_MS_;  
 if (Date.now() - e.ts > ttl) { delete CLIENT_CACHE_[key]; return null; }  
 return e.data;  
}  
/** 여러 사용자가 동시에 수정하는 화면(수주개시/해약중지/인상인하/재개시/상품일보)은  
 * 다른 사용자의 변경사항을 너무 오래 못 보는 일이 없도록 짧은 TTL을 쓴다(탭 전환 시 즉시 표시 + 최대 45초 이내 최신화). */  
const GRID_CACHE_TTL_MS_ = 8 * 60 * 60 * 1000; // Admin.html과 동일하게 8시간으로 확대  
// 탭 재방문 시 재로딩 없이 즉시 렌더링(Admin.html의 SCOPE_LOADED_와 동일 패턴, 읽기전용이라 무효화 불필요)  
const SCOPE_LOADED_ = { order: false, cancel: false, price: false, restart: false, productdaily: false };  
function cacheSet_(key, data) { CLIENT_CACHE_[key] = { data: data, ts: Date.now() }; }  
  
/* ===================== 다른 탭/다른 사용자의 변경사항 자동 반영 (비침습적 버전) =====================  
 * 2026-09-16: 예전 버전은 변경을 감지하면 지금 보고 있는 화면을 곧바로 강제로 새로고침했는데, 작업  
 * 중에 화면이 갑자기 갱신되어 불편하다는 피드백을 받아 다음과 같이 바꿈.  
 * - "데이터갱신정보" 시트에 기록된 각 데이터 시트의 최종 갱신 시점을(Code.gs getSheetVersions) 가볍게  
 * 확인해서, 내가 마지막으로 확인한 시점보다 최신인 시트만(=누군가 데이터를 바꾼 시트만) 골라낸다.  
 * - 바뀐 시트가 "지금 보고 있는 화면"과 무관하면: 화면을 전혀 건드리지 않고 조용히 백그라운드로  
 * 다시 받아 캐시만 채워둔다(SCOPE_PRELOAD_FN_) → 나중에 그 탭으로 이동하면 캐시 적중으로 곧바로  
 * 최신 데이터가 표시된다.  
 * - 바뀐 시트가 "지금 보고 있는 화면"이면: 화면은 그대로 두고 캐시만 비운 뒤, 우측 상단의 수동  
 * 새로고침(🔄) 버튼만 활성화한다. 사용자가 버튼을 누르거나 다른 탭에 갔다가 돌아오면 그때  
 * 실제로 다시 불러온다(사용 중에는 강제로 갱신되는 일이 없음).  
 * - 30초마다 + 탭을 전환할 때(selectTab) 자동으로 확인한다. */  
const SCOPE_OWN_CACHE_KEYS_ = {  
 order: ['orderStartData_', 'orderStartData_ALL'],  
 cancel: ['cancelData_', 'cancelData_ALL'],  
 price: ['priceData_', 'priceData_ALL'],  
 restart: ['restartData_', 'restartData_ALL'],  
 productdaily: ['productDailyData']  
};  

function clearAllAggregateCaches_(scope){
  if (typeof CLIENT_CACHE_ === 'object') {
    Object.keys(CLIENT_CACHE_).forEach(function(k){
      if (k.indexOf('dash|') === 0 ||
          k.indexOf('salesStatus|') === 0 ||
          k.indexOf('dailyReport|') === 0 ||
          k.indexOf('extraProduct|') === 0 ||
          k.indexOf('safetySummaryDaily|') === 0 ||
          k.indexOf('bizTeamStatus') === 0) {
        delete CLIENT_CACHE_[k];
      }
      if (scope) {
        if (scope === 'order' && k.indexOf('orderStartData_') === 0) delete CLIENT_CACHE_[k];
        if (scope === 'cancel' && k.indexOf('cancelData_') === 0) delete CLIENT_CACHE_[k];
        if (scope === 'price' && k.indexOf('priceData_') === 0) delete CLIENT_CACHE_[k];
        if (scope === 'restart' && k.indexOf('restartData_') === 0) delete CLIENT_CACHE_[k];
        if (scope === 'productdaily' && k.indexOf('productDailyData') === 0) delete CLIENT_CACHE_[k];
        if (scope === 'target' && k.indexOf('targetInput|') === 0) delete CLIENT_CACHE_[k];
      }
    });
  }
  DASH_DATA = null;
  SALES_STATUS_LATEST_ = null;
  if (typeof SCOPE_LOADED_ === 'object' && scope && scope in SCOPE_LOADED_) {
    SCOPE_LOADED_[scope] = false;
  }
}

/** 데이터 등록, 수정, 삭제 즉시 호출되어 전체 집계 캐시를 비우고 영업현황/대시보드/일일실적보고를 실시간 갱신 */
function onDataChanged_(scope){
  clearAllAggregateCaches_(scope);

  // 1. 현재 화면이 대시보드 / 영업현황 / 일일실적보고라면 즉시 화면 재조회 & 렌더링
  if (currentTab === 'dashboard') {
    if (typeof loadDashboard === 'function') loadDashboard();
  } else if (currentTab === 'sales_status') {
    if (typeof loadSalesStatus === 'function') loadSalesStatus();
  } else if (currentTab === 'daily_report') {
    if (typeof loadDailyReport === 'function') loadDailyReport();
  }

  // 2. 영업현황 팝업(📊)이 열려있다면 즉시 최신 데이터 다시 받아 팝업 갱신
  const popup = document.getElementById('salesStatusPopupOverlay');
  if (popup && popup.classList.contains('open')) {
    if (typeof fetchSalesStatusForCurrentMode_ === 'function') {
      fetchSalesStatusForCurrentMode_(function(res){
        if (res && res.success) {
          SALES_STATUS_LATEST_ = res;
          renderSalesStatusPopupBody_(res);
        }
      });
    } else {
      google.script.run
        .withSuccessHandler(function(res){
          if (res && res.success) {
            SALES_STATUS_LATEST_ = res;
            renderSalesStatusPopupBody_(res);
          }
        })
        .getSalesStatus(SESSION.token, statusYearMonth, statusProductFilter);
    }
  }

  // 3. 백그라운드 사전 갱신(Prewarm) 즉시 실행
  scheduleDependentCachesRefresh_(true);

  // 4. 크로스 브라우저 탭/창 실시간 브로드캐스트 동기화
  try {
    if (typeof BroadcastChannel !== 'undefined') {
      new BroadcastChannel('s1_sales_sync_channel').postMessage({ type: 'DATA_CHANGED', scope: scope, ts: Date.now() });
    }
  } catch(e) {}
}

function invalidateScopeCache_(scope){  
  onDataChanged_(scope);
}  
function invalidateScopeCacheQuiet_(scope){ invalidateScopeCache_(scope); }

let DEPENDENT_REFRESH_TIMER_ = null;
function scheduleDependentCachesRefresh_(immediate){
  if (DEPENDENT_REFRESH_TIMER_) clearTimeout(DEPENDENT_REFRESH_TIMER_);
  const delay = immediate ? 50 : 300;
  DEPENDENT_REFRESH_TIMER_ = setTimeout(function(){
    DEPENDENT_REFRESH_TIMER_ = null;
    if (!SESSION || !SESSION.token) return;
    refreshDashboardInBackground_();
    refreshDailyReportInBackground_();
    google.script.run
      .withSuccessHandler(function(res){
        if (!res || !res.success) return;
        SALES_STATUS_LATEST_ = res;
        cacheSet_('salesStatus|' + statusYearMonth + '|' + statusProductFilter, res);
        const overlay = document.getElementById('salesStatusPopupOverlay');
        if (overlay && overlay.classList.contains('open')) renderSalesStatusPopupBody_(res);
        if (currentTab === 'sales_status') applySalesStatusResult_(res);
      })
      .withFailureHandler(function(){})
      .getSalesStatus(SESSION.token, statusYearMonth, statusProductFilter);
  }, delay);
}

  google.script.run  
  .withSuccessHandler(function(bundle){  
    if (!bundle || !bundle.success) return;  
    const results = { status: bundle.status, working: bundle.working, order: bundle.order, cancel: bundle.cancel, priceUp: bundle.priceUp, priceDown: bundle.priceDown };  
    cacheSet_(cacheKey, results);  
    if (currentTab === 'dashboard') { DASH_DATA = results; renderDashboard(); }

const STALE_SCOPES_ = new Set();  
const TAB_TO_SCOPES_ = {  
 order_start: ['order'], cancel: ['cancel'], price_change: ['price'],  
 restart: ['restart'], product_daily: ['productdaily'],  
 dashboard: ['order','cancel','price','restart','productdaily'],

const AGGREGATE_TABS_ = { dashboard: 1, sales_status: 1, daily_report: 1 };  
// 다른 화면 데이터가 바뀌었을 때 화면을 건드리지 않고 조용히 다시 받아 캐시만 채워두는 함수 모음  
// (로그인 시 전체를 미리 받아두는 preloadAllTabsInBackground_와 별개로, 특정 scope 하나만 다시 받을 때 사용).  
const SCOPE_PRELOAD_FN_ = {  
 order: function(){ preloadSilent_('orderStartData_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getOrderStartData(SESSION.token, ''); }); },  
 cancel: function(){ preloadSilent_('cancelData_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getCancelData(SESSION.token, ''); }); },  
 price: function(){ preloadSilent_('priceData_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getPriceData(SESSION.token, ''); }); },  
 restart: function(){ preloadSilent_('restartData_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getRestartData(SESSION.token, ''); }); },  
 productdaily: function(){ preloadSilent_('productDailyData', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getProductDailyData(SESSION.token); }); }  
};  
function checkSheetFreshness_(){  
 if (!SESSION || !SESSION.token) return; // 로그인 전에는 확인하지 않음  
 google.script.run  
 .withSuccessHandler(function(versions){  
 if (!versions || versions.error) return;  
 const scopes = ['order', 'cancel', 'price', 'restart', 'productdaily'];  
 const isFirstCheck = !DATA_VERSION_INITED_;  
 const activeScopes = TAB_TO_SCOPES_[currentTab] || [];  
 scopes.forEach(function(scope){  
 const v = Number(versions[scope]) || 0;  
 if (isFirstCheck) { LAST_SEEN_SHEET_VERSION_[scope] = v; return; } // 로그인 직후 기준값만 세팅(불필요한 재조회 방지)  
 if (v <= LAST_SEEN_SHEET_VERSION_[scope]) return;  
 LAST_SEEN_SHEET_VERSION_[scope] = v;  
 if (activeScopes.indexOf(scope) !== -1) {  
 // 지금 보고 있는 화면과 관련된 시트가 바뀜 → 화면은 그대로 두고, 캐시만 비운 뒤 새로고침 버튼만 켠다.  
 if (AGGREGATE_TABS_[currentTab]) invalidateScopeCacheQuiet_(scope); else invalidateScopeCache_(scope);  
 STALE_SCOPES_.add(scope);  
 } else {  
 // 다른 화면의 시트가 바뀜 → 화면 건드리지 않고 조용히 백그라운드로 다시 받아 캐시만 채워둔다.  
 invalidateScopeCache_(scope);  
 SCOPE_PRELOAD_FN_[scope]();  
 }  
 });  
 if (isFirstCheck) DATA_VERSION_INITED_ = true;  
 updateManualRefreshBtn_();  
 })  
 .withFailureHandler(function(){ /* 확인 실패는 조용히 무시(다음 주기에 다시 시도) */ })  
 .getSheetVersions(SESSION.token);  
}  
/** 우측 상단 수동 새로고침(🔄) 버튼: 지금 보고 있는 화면과 관련된 시트 중 아직 반영하지 않은 변경이  
 * 있을 때만 활성화한다. */  
function updateManualRefreshBtn_(){  
 const btn = document.getElementById('manualRefreshBtn');  
 if (!btn) return;  
 const activeScopes = TAB_TO_SCOPES_[currentTab] || [];  
 const stale = activeScopes.some(function(s){ return STALE_SCOPES_.has(s); });  
 btn.disabled = !stale;  
 btn.classList.toggle('has-update', stale);  
 btn.title = stale ? '새로운 데이터가 있습니다. 클릭하여 새로고침' : '최신 상태입니다(새로고침 불필요)';  
}  
/** 수동 새로고침 버튼 클릭 시: 지금 보고 있는 화면만 실제로 다시 불러온다. */  
function manualRefreshNow_(){  
 const activeScopes = TAB_TO_SCOPES_[currentTab] || [];  
 activeScopes.forEach(function(s){ STALE_SCOPES_.delete(s); });  
 if (currentTab === 'order_start') loadData();  
 else if (currentTab === 'cancel') loadCancelData();  
 else if (currentTab === 'price_change') loadPriceData();  
 else if (currentTab === 'restart') loadRestartData();  
 else if (currentTab === 'product_daily') loadProductDailyData();  
 else if (currentTab === 'dashboard') { DASH_DATA = null; loadDashboard(); }  
 else if (currentTab === 'sales_status') { SALES_STATUS_LATEST_ = null; loadSalesStatus(); }  
 else if (currentTab === 'daily_report' && typeof loadDailyReport === 'function') { delete CLIENT_CACHE_['dailyReport|' + dailyReportDate]; loadDailyReport(); }  
 const popup = document.getElementById('salesStatusPopupOverlay');  
 if (popup && popup.classList.contains('open')) showSalesStatusPopup_();  
 updateManualRefreshBtn_();  
}  
setInterval(checkSheetFreshness_, 30000);  
  
  
// 2026-09-18: "세션 유지 시 자동 로그인" 문제로 인해 localStorage 대신 sessionStorage를 사용한다.  
// sessionStorage는 이 브라우저 탭(창)을 완전히 닫으면 사라지므로, 로그인 후 화면을 계속 쓰는  
// 동안에는 유지되지만 브라우저를 재시작하거나 새로 접속하면 다시 로그인해야 한다.  
function loadSession(){
  try {
    const raw = sessionStorage.getItem('s1_admin_session_v1') ||
                sessionStorage.getItem('s1_session_v1') ||
                sessionStorage.getItem('S1_TA_PORTAL_AUTH_SESSION') ||
                sessionStorage.getItem('s1_user');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.phone) return null;
    if (!s.role) {
      s.role = (s.job && (s.job.includes('관리자') || s.job === '지사관리자' || s.job === '본사관리자')) ? '메인마스터' : '읽기전용';
    }
    if (s.isAdmin === undefined) {
      s.isAdmin = (s.role === '메인마스터' || s.role === '서브마스터' || s.role === '수정가능' || s.role === 'master');
    }
    if (s.isMaster === undefined) {
      s.isMaster = (s.role === '메인마스터' || s.role === '서브마스터' || s.role === 'master');
    }
    if (!s.token) s.token = 'sess_' + s.phone + '_' + Date.now();
    return s;
  } catch(e){ return null; }
}
function saveSession(s){
  try {
    sessionStorage.setItem('s1_admin_session_v1', JSON.stringify(s));
    sessionStorage.setItem('s1_session_v1', JSON.stringify(s));
    sessionStorage.setItem('S1_TA_PORTAL_AUTH_SESSION', JSON.stringify(s));
    sessionStorage.setItem('s1_user', JSON.stringify(s));
    if (s && s.phone && s.phone !== 'admin') {
      localStorage.setItem('S1_LAST_LOGIN_PHONE', s.phone);
    }
  } catch(e){}
}
function clearSession(){
  try {
    sessionStorage.removeItem('s1_admin_session_v1');
    sessionStorage.removeItem('s1_session_v1');
    sessionStorage.removeItem('S1_TA_PORTAL_AUTH_SESSION');
    sessionStorage.removeItem('s1_user');
  } catch(e){}
}  
  
/** 화면을 열어두고 있는 동안 60초마다 서버에 "생존 신호"를 보낸다(사용자관리에서 "실시간 접속" 여부를  
 * 판단하는 용도). 로그아웃하지 않고 브라우저 탭/창을 닫거나 PC를 끄면 이 신호가 곧 끊기므로, 실제로  
 * 로그아웃했는지 여부와 무관하게 "지금 화면을 보고 있는지"를 유추할 수 있다. */  
let HEARTBEAT_TIMER_ = null;  
function pingSessionOnce_(){  
 if (!SESSION || !SESSION.token) return;  
 google.script.run.withFailureHandler(function(){}).pingSession(SESSION.token);  
}  
function startHeartbeat_(){  
 if (HEARTBEAT_TIMER_) return;  
 pingSessionOnce_();  
 HEARTBEAT_TIMER_ = setInterval(pingSessionOnce_, 60000);  
}  
  
/* ===================== 유휴시간 기준 세션 연장(2026-09-16, 2026-09-17 수정) =====================  
 * 요청: "화면을 열고 작업 중이면 세션이 계속 유지되고, 화면을 닫거나 아무 조작 없이 방치하면 일정  
 * 시간(1시간) 후 자동 종료되어야 한다."  
 * 위 pingSessionOnce_()(60초 주기 생존신호)는 화면이 "열려만" 있어도 자동으로 계속 불려서 세션을  
 * 연장시키기에 부적합하다(방치해도 안 끊김). 그래서 실제 사용자 조작(클릭/키입력/입력/터치)이 있을  
 * 때만 서버에 세션 연장을 요청하고, 너무 잦은 호출을 막기 위해 최소 2분 간격으로만 실제로 보낸다.  
 * → 1시간 안에 한 번이라도 조작이 있으면 세션이 계속 연장되고, 화면을 닫거나 1시간 동안 아무 조작이  
 * 없으면 서버의 세션 캐시가 자연히 만료되어 자동으로 로그아웃된 것과 같은 효과가 난다.  
 * 2026-09-17 추가: 서버 세션이 자연히 만료될 때까지 기다리지 않고, 클라이언트에서도 마지막 조작 후  
 * 경과 시간을 직접 추적해 같은 시점(1시간)에 화면을 어둡게 바꾸고 "사용하지 않는 시간이 경과하여  
 * 자동 로그아웃 되었습니다."를 띄운 뒤 로그인 화면으로 돌려보낸다(화면을 열어둔 채 방치한 경우  
 * 다음 조작이 있을 때까지 기다리지 않고 즉시 알려주기 위함). 아래 값은 Code.gs의  
 * CONFIG.SESSION_TTL_SEC(초 단위)와 반드시 같은 값을 유지해야 한다. */  
const SESSION_IDLE_TIMEOUT_MS_ = 60 * 60 * 1000; // 1시간 — Code.gs CONFIG.SESSION_TTL_SEC(3600)과 일치시킬 것  
let LAST_ACTIVITY_EXTEND_AT_ = 0;  
let LAST_RAW_ACTIVITY_AT_ = Date.now(); // 서버 호출 여부와 무관하게 "마지막 실제 조작 시각"만 추적(유휴 판정용)  
let IDLE_LOGGED_OUT_ = false;  
const ACTIVITY_EXTEND_MIN_INTERVAL_MS_ = 2 * 60 * 1000; // 최소 2분 간격(서버 호출 과다 방지)  
function markUserActivity_(){  
 LAST_RAW_ACTIVITY_AT_ = Date.now();  
 if (!SESSION || !SESSION.token) return;  
 const now = Date.now();  
 if (now - LAST_ACTIVITY_EXTEND_AT_ < ACTIVITY_EXTEND_MIN_INTERVAL_MS_) return;  
 LAST_ACTIVITY_EXTEND_AT_ = now;  
 google.script.run.withFailureHandler(function(){}).extendSession(SESSION.token);  
}  
['click', 'keydown', 'input', 'touchstart'].forEach(function(evt){  
 document.addEventListener(evt, markUserActivity_, { passive: true });  
});  
/** 30초마다 "마지막 실제 조작 후 얼마나 지났는지"를 확인해서, 유휴 타임아웃(SESSION_IDLE_TIMEOUT_MS_)을  
 * 넘기면 서버 응답을 기다리지 않고 곧바로 화면을 어둡게 만들고 자동 로그아웃 처리한다. */  
setInterval(function(){  
 if (!SESSION || !SESSION.token || IDLE_LOGGED_OUT_) return;  
 if (Date.now() - LAST_RAW_ACTIVITY_AT_ >= SESSION_IDLE_TIMEOUT_MS_) forceIdleLogout_();  
}, 30000);  
/** 화면 전체를 어둡게 덮고 안내 문구를 띄운 뒤, 로그인 정보를 지우고 로그인 화면으로 돌려보낸다. */  
function forceIdleLogout_(){  
 if (IDLE_LOGGED_OUT_) return;  
 IDLE_LOGGED_OUT_ = true;  
 try { if (HEARTBEAT_TIMER_) { clearInterval(HEARTBEAT_TIMER_); HEARTBEAT_TIMER_ = null; } } catch(e){}  
 clearSession();  
 const overlay = document.createElement('div');

function preloadSilent_(cacheKey, runFn){  
 if (cacheGet_(cacheKey, GRID_CACHE_TTL_MS_)) return; // 이미 채워져 있으면 다시 부를 필요 없음  
 try {  
 runFn(function(data){  
 if (data && !data.error && data.success !== false) cacheSet_(cacheKey, data);  
 });  
 } catch (e) {}  
}

function isValidPasswordClient(pw){  
 if (!pw || pw.length < 8 || pw.length > 10) return false;  
 const hasLetter = /[a-zA-Z]/.test(pw);  
 const hasDigit = /[0-9]/.test(pw);  
 const hasSpecial = /[^a-zA-Z0-9]/.test(pw);  
 return hasLetter && hasDigit && hasSpecial;  
}  
  
var LOGIN_BUSY = false;  
  
function setAuthBusy_(busy, btnId, label, busyLabel){  
 LOGIN_BUSY = busy;  
 const btn = document.getElementById(btnId);  
 if (btn) { btn.disabled = busy; btn.innerText = busy ? (busyLabel || '처리 중...') : label; }  
}  
  
function doLogin(){  
 if (LOGIN_BUSY) return;  
 const phone = document.getElementById('login_phone').value.trim();  
 const password = document.getElementById('login_password').value;  
 document.getElementById('login_err').innerText = '';  
 if (!phone || !password) { document.getElementById('login_err').innerText = '전화번호와 비밀번호를 입력하세요.'; return; }  
  
 setAuthBusy_(true, 'loginBtn', '로그인');  
 google.script.run  
 .withSuccessHandler(function(res){  
 setAuthBusy_(false, 'loginBtn', '로그인');  
 if (res && res.success) onLoginSuccess(res);  
 else document.getElementById('login_err').innerText = (res && res.error) || '로그인에 실패했습니다.';  
 })  
 .withFailureHandler(function(err){  
 setAuthBusy_(false, 'loginBtn', '로그인');  
 document.getElementById('login_err').innerText = String(err);  
 })  
 .login(phone, password);  
}  
  
function doRegister(){  
 if (LOGIN_BUSY) return;  
 const name = document.getElementById('reg_name').value.trim();  
 const phone = document.getElementById('reg_phone').value.trim();  
 const password = document.getElementById('reg_password').value;  
 const job = document.getElementById('reg_job').value;  
 document.getElementById('reg_err').innerText = '';  
 if (!name) { document.getElementById('reg_err').innerText = '사용자명을 입력하세요.'; return; }  
 if (!job) { document.getElementById('reg_err').innerText = '직무를 선택하세요.'; return; }  
 if (!phone) { document.getElementById('reg_err').innerText = '전화번호를 입력하세요.'; return; }  
 if (!isValidPasswordClient(password)) {  
 document.getElementById('reg_err').innerText = '비밀번호는 8~10자, 영문자·숫자·특수문자를 모두 포함해야 합니다.';  
 return;  
 }  
  
 setAuthBusy_(true, 'registerBtn', '등록');  
 google.script.run  
 .withSuccessHandler(function(res){  
 setAuthBusy_(false, 'registerBtn', '등록');  
 if (res && res.success) {  
 onLoginSuccess(res);  
 return;  
 }  
 if (res && res.alreadyExists) {  
 alert(res.error || '등록된 사용자가 있습니다.\n비밀번호를 잊으신 경우 관리자에게 문의해 주세요.');

 return;  
 }  
 document.getElementById('reg_err').innerText = (res && res.error) || '등록에 실패했습니다.';  
 })  
 .withFailureHandler(function(err){  
 setAuthBusy_(false, 'registerBtn', '등록');  
 document.getElementById('reg_err').innerText = String(err);  
 })  
 .registerUser(name, phone, password, job);  
}

function computeAutoFields(row){  
 const today = todayStr();  
 const 개시월 = row.개시일 ? yyyymm(row.개시일) : '미정';  
 const 이월 = !row.개시일 ? '미정' : (개시월 === yyyymm(today) ? '당월' : '이월');  
 const 개시 = (row.기산일 && row.기산일 !== '미정')  
 ? (yyyymm(row.기산일) > yyyymm(today) ? '예정' : '확정')  
 : '미정';  
 const 수주월 = row.계약일 ? yyyymm(row.계약일) : '';  
 const 구분 = row.기산일 === '미정' ? '미개시' : (row.기산일 ? (row.기산일 < today ? '개시' : '미개시') : '');  
 return { 개시, 수주월, 개시월, 이월, 구분 };  
}

/** win: window.open()으로 미리 열어둔(동기적으로 열어야 팝업 차단을 피할 수 있음) 빈 창.  
 * URL이 준비되면 그 창의 위치만 옮긴다. win이 없으면(팝업이 차단됐던 경우) 새로 열어본다. */  
function openTaPortalWithUrl_(baseUrl, win){  
  let url = String(baseUrl || '').trim() || 'https://jhsim2545.github.io/TA-Manager/';  
  if (url.indexOf('script.google.com') !== -1) {  
    url = 'https://jhsim2545.github.io/TA-Manager/';  
  }  

  const sess = (typeof SESSION !== 'undefined' && SESSION) ? SESSION : (typeof getSession_ === 'function' ? getSession_() : null);  
  const userName = (sess && sess.name) ? sess.name : '지사장';  
  const userPhone = (sess && sess.phone) ? sess.phone : '01027042545';  
  const userJob = (sess && sess.job) ? sess.job : '컨설턴트';  
  const isMaster = (sess && (sess.isMainMaster || sess.isMaster || sess.isAdmin || sess.role === '메인마스터' || sess.role === '서브마스터' || sess.role === 'master'));  
  const userRole = isMaster ? 'master' : 'user';  

  // TA 관리 포털 규격 세션 데이터 생성 및 브라우저 세션 스토리지에 동기화
  const taSessionData = {  
    phone: userPhone,  
    name: userName,  
    job: userJob,  
    role: userRole,  
    screen: isMaster ? 'master' : userName,  
    modal: null,  
    savedAt: Date.now()  
  };  

  const taUserData = {  
    phone: userPhone,  
    name: userName,  
    job: userJob,  
    role: userRole  
  };  

  try {  
    sessionStorage.setItem('S1_TA_PORTAL_AUTH_SESSION', JSON.stringify(taSessionData));  
    sessionStorage.setItem('s1_user', JSON.stringify(taUserData));  
    localStorage.setItem('S1_LAST_LOGIN_PHONE', userPhone);  
    localStorage.setItem('S1_TA_SSO_SESSION', JSON.stringify(taSessionData));  
  } catch(e) {  
    console.warn('[TA SSO] 세션 저장 실패:', e);  
  }  

  if (typeof logUserAction_ === 'function') {  
    logUserAction_('TA 포털 이동', '외부연동', '', { desc: userName + ' TA 관리 포털 바로가기 접속' });  
  }  

  // SSO URL 파라미터 조합
  const sep = url.indexOf('?') === -1 ? '?' : '&';  
  const devType = (typeof detectDeviceType_ === 'function' ? detectDeviceType_() : 'pc');  

  const ssoParams = [  
    'sso=1',  
    'name=' + encodeURIComponent(userName),  
    'phone=' + encodeURIComponent(userPhone),  
    'job=' + encodeURIComponent(userJob),  
    'role=' + encodeURIComponent(userRole),  
    'master=' + (isMaster ? '1' : '0'),  
    'agent=' + encodeURIComponent(userName),  
    'device=' + devType,  
    (isMaster ? 'view=dashboard' : '')  
  ].filter(Boolean).join('&');  

  const finalUrl = url.replace(/\/+$/, '') + '/' + sep + ssoParams;  

  if (win && !win.closed) {   
    win.location.href = finalUrl;   
  } else {   
    window.open(finalUrl, '_blank');   
  }  
}

function polarToCartesian_(cx, cy, r, angleDeg){  
 const rad = (angleDeg - 90) * Math.PI / 180;  
 return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };  
}  
function pieSliceSvgPath_(cx, cy, r, startAngle, endAngle){  
 const start = polarToCartesian_(cx, cy, r, endAngle);  
 const end = polarToCartesian_(cx, cy, r, startAngle);  
 const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;  
 return 'M ' + cx + ' ' + cy + ' L ' + start.x + ' ' + start.y + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 0 ' + end.x + ' ' + end.y + ' Z';  
}  
function pieChartHtml_(list, valueKey, pctKey, fmtFn, colorFn){  
 if (!list || !list.length) return '<div style="color:#999; font-size:14px; padding:6px 0;">데이터 없음</div>';  
 colorFn = colorFn || function(it, idx){ return COMP_COLORS[idx % COMP_COLORS.length]; };  
 const total = list.reduce(function(s,it){ return s + (Number(it[valueKey])||0); }, 0);  
 let angle = 0;  
 const r = 50, cx = 55, cy = 55;  
 let svg = '<svg width="110" height="110" viewBox="0 0 110 110">';  
 if (total <= 0) {  
 svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#eef1f4"></circle>';  
 } else {  
 list.forEach(function(it, idx){  
 const val = Number(it[valueKey]) || 0;  
 const frac = val / total;  
 if (frac <= 0) return;  
 const startAngle = angle;  
 const endAngle = angle + frac * 360;  
 angle = endAngle;  
 const color = colorFn(it, idx);  
 if (frac >= 0.9999) {  
 svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"></circle>';  
 } else {  
 svg += '<path d="' + pieSliceSvgPath_(cx, cy, r, startAngle, endAngle) + '" fill="' + color + '"></path>';  
 }  
 });  
 }  
 svg += '</svg>';  
 const legend = list.map(function(it, idx){  
 const color = colorFn(it, idx);  
 const pct = it[pctKey];  
 const valDisp = fmtFn ? fmtFn(it[valueKey]) : it[valueKey];  
 return '<div style="display:flex; align-items:center; gap:5px; font-size:13px; margin-bottom:3px;">' +  
 '<span style="width:9px;height:9px;border-radius:2px;background:'+color+';display:inline-block;flex-shrink:0;"></span>' +  
 '<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+it.name+'</span>' +  
 '<span style="color:#666; white-space:nowrap;">'+pct+'% ('+valDisp+')</span>' +  
 '</div>';  
 }).join('');  
 return '<div style="display:flex; gap:10px; align-items:flex-start;">' +  
 '<div style="flex-shrink:0;">' + svg + '</div>' +  
 '<div style="flex:1; min-width:0;">' + legend + '</div>' +  
 '</div>';  
}

/* ===================== 사업팀현황(종합대시보드 내부 화면, 읽기 전용) ===================== */  
let BIZ_TEAM_STATUS_DATA_ = null;  
// 사업팀현황 화면 상단의 날짜/상품종류 선택 상태 — 기본값은 오늘 날짜, 일반알람.  
let BIZ_TEAM_VIEW_DATE_ = todayStr();  
let BIZ_TEAM_VIEW_PRODUCT_ = '일반알람';  
const BIZ_TEAM_PRODUCT_TYPES_ = ['일반알람', '휴엔', '안전상품', '디지털(정보보안)'];  
function bizTeamStatusCacheKey_(){  
 return 'bizTeamStatus|' + BIZ_TEAM_VIEW_DATE_ + '|' + BIZ_TEAM_VIEW_PRODUCT_;  
}  
/** 아직 못 불러왔을 때만 서버(또는 캐시)에서 [선택한 날짜 이전이거나 같은 날짜 중 가장 최신] 사업팀 데이터를  
 * 받아온 뒤 cb를 호출한다. 이미 불러온 상태면 즉시 리턴(불필요한 재조회/재귀 렌더 방지). */  
let BIZ_TEAM_LOADING_PROMISE_ = null;
function ensureBizTeamStatusLoaded_(cb){  
  if (BIZ_TEAM_STATUS_DATA_) { return; } // 이미 데이터가 있으면 절대 재귀 호출하지 않음
  const cacheKey = bizTeamStatusCacheKey_();  
  const cached = cacheGet_(cacheKey, GRID_CACHE_TTL_MS_) || cacheGet_('bizTeamStatusLatest_', GRID_CACHE_TTL_MS_);  
  if (cached) { 
    BIZ_TEAM_STATUS_DATA_ = cached; 
    if (cached.date && !isBlockedDate(cached.date)) BIZ_TEAM_VIEW_DATE_ = cached.date;
    if (cb) setTimeout(cb, 0); // 비동기 안전 실행으로 콜스택 초과 원천 차단
    return; 
  }  
  // 이미 백그라운드 요청 중인 경우 중복 네트워크 호출 방지 및 완료 대기
  if (BIZ_TEAM_LOADING_PROMISE_) {
    if (cb) BIZ_TEAM_LOADING_PROMISE_.then(function(){ setTimeout(cb, 0); });
    return;
  }
  BIZ_TEAM_LOADING_PROMISE_ = new Promise(function(resolve){
    google.script.run  
      .withSuccessHandler(function(res){  
        BIZ_TEAM_LOADING_PROMISE_ = null;
        BIZ_TEAM_STATUS_DATA_ = res || { success: false, error: '알 수 없는 오류' };  
        if (res && res.success) {
          cacheSet_(cacheKey, res);  
          cacheSet_('bizTeamStatusLatest_', res);
          if (res.date && !isBlockedDate(res.date)) BIZ_TEAM_VIEW_DATE_ = res.date;
        }
        resolve();
        if (cb) setTimeout(cb, 0);  
      })  
      .withFailureHandler(function(err){ 
        BIZ_TEAM_LOADING_PROMISE_ = null;
        BIZ_TEAM_STATUS_DATA_ = { success: false, error: String(err) }; 
        resolve();
        if (cb) setTimeout(cb, 0); 
      })  
      .getBizTeamDataNearestOnOrBefore(SESSION.token, BIZ_TEAM_VIEW_DATE_, BIZ_TEAM_VIEW_PRODUCT_);  
  });
}

/** 상단의 기준일자/상품종류 선택이 바뀌면 호출 — 조건이 달라졌으니 다시 조회한다(캐시에 있으면 즉시 표시). */  
function bizTeamViewFilterChanged_(){  
 const dateInput = document.getElementById('bizTeamViewDate');  
 const newDate = dateInput.value || todayStr();  
 // 토·일·공휴일은 사업팀 데이터가 없는 날이므로 선택하지 못하도록 막고, 이전에 선택돼 있던 날짜로 되돌린다.  
 if (isBlockedDate(newDate)) {  
 alert('토·일·공휴일은 선택할 수 없습니다. 평일을 선택해 주세요.');  
 dateInput.value = BIZ_TEAM_VIEW_DATE_;  
 return;  
 }  
 BIZ_TEAM_VIEW_DATE_ = newDate;  
 BIZ_TEAM_VIEW_PRODUCT_ = document.getElementById('bizTeamViewProduct').value || '일반알람';  
 BIZ_TEAM_STATUS_DATA_ = null;  
 renderDashboard();  
}  
/** 날짜 입력창 좌우 화살표 버튼 — 토·일·공휴일은 건너뛰고 가장 가까운 평일로 이동한 뒤 곧바로 재조회/재렌더링한다. */  
function bizTeamShiftViewDate_(deltaDays){  
 const input = document.getElementById('bizTeamViewDate');  
 if (!input || !input.value) return;  
 const d = new Date(input.value + 'T00:00:00');  
 const step = deltaDays >= 0 ? 1 : -1;  
 do {  
 d.setDate(d.getDate() + step);  
 } while (isBlockedDate(fmtDate(d)));  
 input.value = fmtDate(d);  
 bizTeamViewFilterChanged_();  
}  
function bizTeamFindRow_(rows, label){  
 return (rows || []).find(function(r){ return r.label === label; }) || null;  
}  
function bizTeamParseNum_(v){  
 const n = parseFloat(String(v || '').replace(/[^0-9.\-]/g, ''));  
 return isNaN(n) ? 0 : n;  
}  
/** 내림차순 정렬된 items(각 {value,...})를 받아 동일 순위 처리(표준경쟁순위: 1,1,1,4,4,4,4,8식)를 적용한  
 * 순위 배열을 반환한다. 값이 같으면 같은 순위, 다음 값은 그 앞까지의 인원 수만큼 건너뛴 순위를 받는다. */  
function bizTeamComputeRanks_(sortedItems){  
 const ranks = [];  
 let prevValue = null, prevRank = 0;  
 sortedItems.forEach(function(it, idx){  
 if (prevValue !== null && it.value === prevValue) {  
 ranks.push(prevRank);  
 } else {  
 ranks.push(idx + 1);  
 prevRank = idx + 1;  
 }  
 prevValue = it.value;  
 });  
 return ranks;  
}  
/** branches/row(달성률 등 하나의 지표 행)를 받아 내림차순 순위 막대차트를 만들고, 북서울 지사 막대를 강조 표시한다. */  
/** 공용 툴팁: 막대에 마우스를 올리거나 클릭하면 해당 지사의 정확한 달성률(%)을 보여준다. */  
function bizTeamEnsureTooltip_(){  
 let tip = document.getElementById('bizTeamTooltip_');  
 if (!tip) {  
 tip = document.createElement('div');  
 tip.id = 'bizTeamTooltip_';  
 tip.style.cssText = 'position:fixed; z-index:9999; display:none; background:#152a4a; color:#fff; font-size:12px; font-weight:700; padding:4px 9px; border-radius:4px; pointer-events:none; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.25);';  
 document.body.appendChild(tip);  
 // 막대가 아닌 다른 곳을 클릭하면 툴팁을 닫는다(터치/클릭 방식 지원).  
 document.addEventListener('click', function(e){  
 if (!e.target.closest || !e.target.closest('.biz-team-bar-row')) bizTeamHideTooltip_();  
 });  
 }  
 return tip;  
}  
function bizTeamShowTooltip_(evt, text){  
 const tip = bizTeamEnsureTooltip_();  
 tip.innerText = text;  
 tip.style.left = (evt.clientX + 14) + 'px';  
 tip.style.top = (evt.clientY + 14) + 'px';  
 tip.style.display = 'block';  
}  
function bizTeamHideTooltip_(){  
 const tip = document.getElementById('bizTeamTooltip_');  
 if (tip) tip.style.display = 'none';  
}  
/** renderDashboard()가 innerHTML을 새로 채운 뒤 호출 — 사업팀현황 섹션 막대마다 hover/click 툴팁 이벤트를 연결한다. */  
function bizTeamBindBarTooltips_(){  
 document.querySelectorAll('.biz-team-bar-row').forEach(function(el){  
 const tipText = el.getAttribute('data-tip') || '';  
 el.addEventListener('mouseenter', function(e){ bizTeamShowTooltip_(e, tipText); });  
 el.addEventListener('mousemove', function(e){ bizTeamShowTooltip_(e, tipText); });  
 el.addEventListener('mouseleave', bizTeamHideTooltip_);  
 el.addEventListener('click', function(e){ e.stopPropagation(); bizTeamShowTooltip_(e, tipText); });  
 });  
}  
/** 유지증가 달성률처럼 마이너스(순감소)와 플러스(순증가)가 모두 나올 수 있는 지표용 — 가운데를 0으로 두고  
 * 양수는 오른쪽, 음수는 왼쪽으로 뻗어나가는 대칭형(발산형) 막대차트. 마이너스 막대는 채도를 낮춘 색으로 그려  
 * "마이너스"라는 느낌이 시각적으로 들도록 한다. */  
function bizTeamDivergingChartHtml_(title, branches, row){  
 if (!row || !branches.length) {  
 return '<div class="dash-section" style="flex:1 1 0; min-width:230px;"><div class="dash-section-title"><span>' + escHtml(title) + '</span></div><div style="padding:16px; color:#999; font-size:13px;">데이터 없음</div></div>';  
 }  
 const items = branches.map(function(b, i){ return { branch: b, value: bizTeamParseNum_(row.values[i]) }; });  
 items.sort(function(a, b){  
 if (b.value !== a.value) return b.value - a.value;  
 if (a.branch === '북서울') return -1; // 동석차일 때 북서울을 해당 순위 그룹 맨 위로  
 if (b.branch === '북서울') return 1;  
 return 0;  
 });  
 const ranks = bizTeamComputeRanks_(items); // 동일 값은 동일 순위(1,1,1,4,4,4,4,8식)  
 const maxAbs = Math.max.apply(null, items.map(function(it){ return Math.abs(it.value); }).concat([1]));  
 const myIdx = items.findIndex(function(it){ return it.branch === '북서울'; });  
 const bars = items.map(function(it, idx){  
 const isMine = it.branch === '북서울';  
 const isNeg = it.value < 0;  
 const halfPct = Math.min(100, (Math.abs(it.value) / maxAbs) * 100);  
 const posColor = isMine ? '#c0392b' : '#4a86e8';  
 const negColor = isMine ? '#d9a8a3' : '#b7c1d1'; // 채도를 낮춘 색상 — 마이너스(순감소) 느낌  
 const barColor = isNeg ? negColor : posColor;  
 const tipText = escHtml(it.branch + ': ' + (it.value > 0 ? '+' : '') + it.value.toFixed(0) + '%');  
 return '<div class="biz-team-bar-row" data-tip="' + tipText + '" style="display:flex; align-items:center; gap:6px; margin:3px 0; cursor:pointer;">' +  
 '<div style="width:18px; text-align:right; font-size:11px; color:#888;">' + ranks[idx] + '</div>' +  
 '<div style="width:56px; font-size:12px; font-weight:' + (isMine ? '700' : '400') + '; color:' + (isMine ? '#c0392b' : '#333') + '; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escHtml(it.branch) + '</div>' +  
 '<div style="flex:1; display:flex; height:14px; position:relative;">' +  
 '<div style="width:50%; display:flex; justify-content:flex-end; background:#eef1f4; overflow:hidden; border-radius:3px 0 0 3px;">' +  
 (isNeg ? '<div style="width:' + halfPct + '%; height:100%; background:' + barColor + ';"></div>' : '') +  
 '</div>' +  
 '<div style="width:50%; background:#eef1f4; overflow:hidden; border-radius:0 3px 3px 0;">' +  
 (!isNeg ? '<div style="width:' + halfPct + '%; height:100%; background:' + barColor + ';"></div>' : '') +  
 '</div>' +  
 '<div style="position:absolute; left:50%; top:0; bottom:0; width:1px; background:#8b96a3;"></div>' +  
 '</div>' +  
 '</div>';  
 }).join('');  
 const rankLabel = myIdx >= 0 ? ('북서울 ' + ranks[myIdx] + '위/' + items.length) : '';  
 return '<div class="dash-section" style="flex:1 1 0; min-width:230px;"><div class="dash-section-title"><span>' + escHtml(title) + '</span>' +  
 (rankLabel ? '<span style="font-size:12px; color:#c0392b; font-weight:700;">' + escHtml(rankLabel) + '</span>' : '') +  
 '</div><div style="padding:8px 4px;">' + bars + '</div></div>';

function bizTeamRankChartHtml_(title, branches, row){  
 if (!row || !branches.length) {  
 return '<div class="dash-section" style="flex:1 1 0; min-width:230px;"><div class="dash-section-title"><span>' + escHtml(title) + '</span></div><div style="padding:16px; color:#999; font-size:13px;">데이터 없음</div></div>';  
 }  
 const items = branches.map(function(b, i){ return { branch: b, value: bizTeamParseNum_(row.values[i]) }; });  
 items.sort(function(a, b){  
 if (b.value !== a.value) return b.value - a.value;  
 if (a.branch === '북서울') return -1; // 동석차일 때 북서울을 해당 순위 그룹 맨 위로  
 if (b.branch === '북서울') return 1;  
 return 0;  
 });  
 const ranks = bizTeamComputeRanks_(items); // 동일 값은 동일 순위(1,1,1,4,4,4,4,8식)  
 const maxVal = Math.max.apply(null, items.map(function(it){ return it.value; }).concat([1]));  
 const myIdx = items.findIndex(function(it){ return it.branch === '북서울'; });  
 const bars = items.map(function(it, idx){  
 const isMine = it.branch === '북서울';  
 const pct = maxVal > 0 ? Math.max(2, (it.value / maxVal) * 100) : 0;  
 const barColor = isMine ? '#c0392b' : '#4a86e8';  
 const tipText = escHtml(it.branch + ': ' + it.value.toFixed(0) + '%');  
 return '<div class="biz-team-bar-row" data-tip="' + tipText + '" style="display:flex; align-items:center; gap:6px; margin:3px 0; cursor:pointer;">' +  
 '<div style="width:18px; text-align:right; font-size:11px; color:#888;">' + ranks[idx] + '</div>' +  
 '<div style="width:56px; font-size:12px; font-weight:' + (isMine ? '700' : '400') + '; color:' + (isMine ? '#c0392b' : '#333') + '; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escHtml(it.branch) + '</div>' +  
 '<div style="flex:1; background:#eef1f4; border-radius:3px; overflow:hidden; height:14px;">' +  
 '<div style="width:' + pct + '%; background:' + barColor + '; height:100%;"></div>' +  
 '</div>' +  
 '</div>';  
 }).join('');  
 const rankLabel = myIdx >= 0 ? ('북서울 ' + ranks[myIdx] + '위/' + items.length) : '';  
 return '<div class="dash-section" style="flex:1 1 0; min-width:230px;"><div class="dash-section-title"><span>' + escHtml(title) + '</span>' +  
 (rankLabel ? '<span style="font-size:12px; color:#c0392b; font-weight:700;">' + escHtml(rankLabel) + '</span>' : '') +  
 '</div><div style="padding:8px 4px;">' + bars + '</div></div>';  
}

 return order;  
}

 [LIST_SALES_REP, LIST_CANCEL_SALES_REP, LIST_PRICE_SALES_REP, LIST_RESTART_SALES_REP, DASH_REP_LIST, REP_TARGET_LIST].forEach(function(arr){  
 arr.length = 0; lists.영업컨설턴트.forEach(function(v){ arr.push(v); });  
 });

// 데이터를 불러오는 동안 회전 스피너 + 가짜(시뮬레이션) 진행률(0~99%)을 함께 보여준다.  
// Apps Script는 서버 작업의 실제 진행률을 알려주지 않으므로, 시간이 지날수록 점점 느려지며 99%에 가까워지는  
// 방식으로 "진행되고 있다"는 느낌을 준다. 실제 데이터가 도착해 render() 등이 #content를 통째로 새 내용으로  
// 갈아끼우면 진행률 DOM 요소 자체가 사라지므로, 타이머가 이를 감지하고 스스로 멈춘다(별도 종료 호출 불필요).  
/** 탭 데이터를 불러오는 도중 사용자가 "다시 시도" 버튼을 눌러 같은 데이터를 다시 요청하면,  
 * 화면에는 새 요청이 진행 중이지만 그 전에 보냈던(응답이 너무 늦게 온) 요청도 구글 서버에서는  
 * 여전히 실행 중이다. google.script.run은 클라이언트에서 요청을 취소할 방법이 없어서, 오래된 요청이  
 * 나중에 뒤늦게 응답으로 돌아오면 방금 새로 불러온 최신 화면을 예전 데이터로 덮어써 버릴 수 있다  
 * ("로딩이 되기도 하고 안 되기도 하고 일관성이 없다"는 증상의 원인 중 하나). 탭/기능별로 "가장 최근에  
 * 보낸 요청 번호"만 기억해두었다가, 그보다 오래된 요청의 응답은 무시하도록 한다. */  
const LOAD_GEN_ = {};  
function nextLoadGen_(key){ LOAD_GEN_[key] = (LOAD_GEN_[key] || 0) + 1; return LOAD_GEN_[key]; }  
function isStaleLoadGen_(key, gen){ return gen !== LOAD_GEN_[key]; }  
  
/** 화면마다 상단 요약표 등 .grid-wrap 위에 오는 내용의 높이가 제각각이라, .grid-wrap에 고정 높이를  
 * css로만 주면 뷰포트보다 내용이 길어져 페이지 전체 스크롤 + 표 내부 스크롤이 동시에 생기는 "2중 스크롤"이  
 * 발생한다. 실제로 표가 화면에서 시작하는 위치(getBoundingClientRect)를 기준으로 남은 높이만큼만 표 영역에  
 * 부여해서, 표 내부 스크롤 하나만 남도록 맞춘다. */  
function fitGridWrapToViewport_(){  
 document.querySelectorAll('.grid-wrap').forEach(function(el){  
 if (el.dataset.noAutoFit) return;  
 const rect = el.getBoundingClientRect();  
 const h = window.innerHeight - rect.top - 12;  
 el.style.height = Math.max(h, 160) + 'px';  
 });  
}  
/** 영업현황 표처럼 헤더가 2줄(rowspan/colspan 혼용)인 표는 모든 th에 공통으로 걸린  
 * position:sticky; top:0 규칙 때문에 2번째 헤더 줄이 1번째 줄과 같은 위치(top:0)에 들러붙어  
 * 스크롤 시 "날짜" 등 rowspan 헤더가 그 아래 실제 값을 가리는 것처럼 겹쳐 보이는 문제가 있었다.  
 * 1번째 헤더 줄의 실제 높이만큼 2번째 줄의 sticky top 값을 내려서 서로 겹치지 않게 맞춘다. */  
function fitTwoRowStickyHeader_(tableSelector){  
 const table = document.querySelector(tableSelector);  
 if (!table) return;  
 const theadRows = table.querySelectorAll('thead tr');  
 if (theadRows.length < 2) return;  
 const firstRowHeight = theadRows[0].getBoundingClientRect().height;  
 Array.from(theadRows[1].children).forEach(function(th){ th.style.top = firstRowHeight + 'px'; });  
}  
window.addEventListener('resize', function(){ fitGridWrapToViewport_(); fitTwoRowStickyHeader_('.status-wrap .grid-wrap table'); });  
  
let LOADING_PROGRESS_TIMER_ = null;  
// retryFnName: 약 30초가 지나도 응답이 없을 때 "다시 시도" 버튼에 연결할 전역 함수 이름(문자열).  
// 서버(Apps Script) 응답이 간헐적으로 오지 않는 경우, 화면이 영구히 "불러오는 중"에 멈춰 있지 않도록  
// 안내 메시지 + 재시도 버튼으로 전환한다.  
function showLoadingProgress_(elId, text, retryFnName){  
 if (LOADING_PROGRESS_TIMER_) { clearInterval(LOADING_PROGRESS_TIMER_); LOADING_PROGRESS_TIMER_ = null; }  
 const el = document.getElementById(elId);  
 if (!el) return;  
 el.innerHTML = '<div class="loading loading-spin">' +  
 '<div class="loading-text">' + text + '</div>' +  
 '<div class="loading-progress-track"><div class="loading-progress-fill" id="loadingProgressFill_"></div></div>' +  
 '<div class="loading-progress-pct" id="loadingProgressPct_">0%</div>' +  
 '</div>';  
 let pct = 0, ticks = 0;  
 LOADING_PROGRESS_TIMER_ = setInterval(function(){  
 ticks++;  
 const fill = document.getElementById('loadingProgressFill_');  
 const lbl = document.getElementById('loadingProgressPct_');  
 if (!fill || !lbl) { clearInterval(LOADING_PROGRESS_TIMER_); LOADING_PROGRESS_TIMER_ = null; return; }  
 pct += (99 - pct) * 0.12 + 0.3;  
 if (pct > 99) pct = 99;  
 fill.style.width = pct + '%';  
 lbl.innerText = Math.round(pct) + '%';  
 if (ticks > 150) { // 약 30초 동안 응답이 없으면 지연 안내 + 재시도 버튼으로 전환  
 clearInterval(LOADING_PROGRESS_TIMER_); LOADING_PROGRESS_TIMER_ = null;  
 const el2 = document.getElementById(elId);  
 if (el2) {  
 el2.innerHTML = '<div class="loading" style="text-align:center; padding:24px 0;">' +  
 '<div style="color:#c0392b; font-weight:600; margin-bottom:8px; font-size:14px;">서버 응답이 지연되고 있습니다.</div>' +  
 '<div style="color:#888; font-size:12px; margin-bottom:14px;">네트워크 상태를 확인해 주시거나 아래 버튼으로 다시 시도해 주세요.</div>' +  
 (retryFnName ? ('<button class="primary" onclick="' + retryFnName + '()">다시 시도</button>') : '') +  
 '</div>';  
 }  
 }  
 }, 200);  
}

/* ===================== 정렬 ===================== */  
function sortedRows(){  
 const filterText = (document.getElementById('searchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterOrder')||{}).value || '';  
 let list = ROWS.map(r => Object.assign({}, r, computeAutoFields(r)));  
 if (filterText) {  
 list = list.filter(r => String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 }  
 if (repFilter) list = list.filter(r => r.영업담당 === repFilter);  
 if (chkVal('onlyUnstartedOrder', true)) list = list.filter(r => r.구분 === '미개시');  
 if (chkVal('excludeGrossOrder', false)) list = list.filter(r => String(r.그로스 || '').trim() === '일반');  
 const key = sortState.key, dir = sortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) => {  
 let va = a[key], vb = b[key];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1; // 빈 값은 항상 마지막  
 if (blankB) return -1;  
 if (key === '용역료') { va = Number(va); vb = Number(vb); }  
 if (va < vb) return -1 * dir;  
 if (va > vb) return 1 * dir;  
 return 0;  
 });  
 return list;  
}  
  
function setSort(key){  
 if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';  
 else { sortState.key = key; sortState.dir = 'asc'; }  
 render();  
}  
  
/* ===================== 그리드 렌더 ===================== */  
function headerCell(h){  
 const arrow = sortState.key === h ? (sortState.dir === 'asc' ? '▲' : '▼') : '';  
 const sw = localStorage.getItem('colw_order_' + h);  
 const style = sw ? ` style="width:${sw}px; min-width:${sw}px;"` : '';  
 return `<th${style} onclick="setSort('${h}')">${h}<span class="arrow">${arrow}</span><div class="col-resizer" onclick="event.stopPropagation()" onmousedown="initColResize(event, 'order', '${h}')"></div></th>`;  
}  
  
const ORDER_DATE_FIELDS = ['보고일','계약일','개시일','기산일'];  
const ORDER_MONTH_FIELDS = ['수주월','개시월'];  
  
function productCellClass_(val){  
  const s = String(val === null || val === undefined ? '' : val).trim();  
  if (s === '정보보안') return ' prod-sec';  
  if (s === '블루스캔') return ' prod-blue';  
  if (s === '휴엔') return ' prod-huen';  
  if (s === '유지보수') return ' prod-maint';  
  return '';  
}  
function orderCellClass(row, field, val, allRows){  
 let cls = '';  
 if (field === '계약번호' || field === '상품' || field === '그로스') cls = 'contract-cell' + (contractCellBad(val, allRows, '계약번호') ? ' contract-bad' : '');  
 else if (field === '계약처명') cls = 'name-cell';  
 else if (field === '용역료') cls = 'fee money num';  
 else if (field === '담당차량') cls = 'center center-cell narrow';  
 else if (ORDER_DATE_FIELDS.indexOf(field) !== -1) cls = 'datecol';  
 else if (field === '비고') cls = 'wide-note';  
 if (field === '그로스' && String(val) === '법인') cls += ' gross-corp';  
 if (field === '상품') cls += productCellClass_(val);  
 if (['개시일','기산일'].indexOf(field) !== -1 && String(val) === todayStr()) cls += ' today-hl';  
 else if (sortState.key === field) cls += ' sort-col';  
 return cls.trim();  
}  
  
function fieldCellHtml(row, field, allRows){  
 const val = row[field] !== undefined && row[field] !== null ? row[field] : '';  
 let cls = orderCellClass(row, field, val, allRows);  
 let disp;  
 const isDateField = ORDER_DATE_FIELDS.indexOf(field) !== -1;  
 if (field === '용역료') disp = commaFmt(val);  
 else if (isDateField) disp = fmtMD(val);  
 else disp = val;  
 const titleAttr = (field === '계약처명' || field === '비고' || isDateField) ? ` title="${escAttr(val)}"` : '';  
 // 수정권한 없는 사용자도 날짜만은 클릭 → 팝업으로 고칠 수 있게 함(요청: 화면에서 직접 수정하는 게 아니라 팝업으로).  
 if (isDateField) {  
 cls += ' date-editable';  
 return `<td class="${cls}"${titleAttr} data-scope="order" data-id="${escAttr(row.id)}" data-field="${escAttr(field)}" data-val="${escAttr(val)}" onclick="openDateEditPopup_(this)">${escHtml(disp)}</td>`;  
 }  
 return `<td class="${cls}"${titleAttr}>${escHtml(disp)}</td>`;  
}  
  
function render(){  
 const rows = sortedRows();  
  
 let html = '<div class="grid-wrap"><table><thead><tr>' + flagHeaderHtml('order');  
 HEADERS.forEach(h => html += headerCell(h));  
 html += '</tr></thead><tbody>';  
  
 rows.forEach(row => {  
 const rowCls = ((row._syncError ? 'sync-error' : (row._unsynced ? 'unsynced' : '')) + flagRowClass('order', row.id)).trim();  
 html += `<tr data-id="${row.id}" class="${rowCls}">` + flagCellHtml('order', row.id);  
 HEADERS.forEach(h => {  
 if (AUTO_FIELDS.includes(h)) {  
 const isMonth = ORDER_MONTH_FIELDS.indexOf(h) !== -1;  
 const disp = isMonth ? fmtMonth(row[h]) : row[h];  
 const autoCls = ('auto ' + statusClass(row[h]) + (isMonth ? ' monthcol' : '') + (sortState.key === h ? ' sort-col' : '')).trim();  
 html += `<td class="${autoCls}">${escHtml(disp)}</td>`;  
 } else {  
 html += fieldCellHtml(row, h, rows);  
 }  
 });  
 html += '</tr>';  
 });  
  
 html += '</tbody></table></div>';  
 document.getElementById('content').innerHTML = html;  
 document.getElementById('rowCount').innerText = `총 ${rows.length}건`;  
 document.getElementById('rowSumOrder').innerText = flaggedSumText_(rows, '용역료');  
 updateCopyButtonState_('order', rows);  
}  
  
/* ===================== 낙관적 업데이트: 인라인 수정 ===================== */  
function onFieldChange(id, field, value){  
 const row = ROWS.find(r => r.id === id);  
 if (!row) return;  
 row[field] = value;  
 row._unsynced = true;  
 row._syncError = false;  
 render();  
 pushSave(row);  
}  
  
function pushSave(row){  
 setSyncStatus('saving');  
 const fields = {};  
 EDITABLE_FIELDS.forEach(f => fields[f] = row[f] !== undefined ? row[f] : '');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) {  
 row._unsynced = false;  
 row._syncError = false;  
 setSyncStatus('ok'); onDataChanged_('order');  
 } else {  
 row._syncError = true;  
 setSyncStatus('error', res && res.error);  
 handleSessionExpiry(res);  
 }  
 render();  
 })  
 .withFailureHandler(function(err){  
 row._syncError = true;  
 setSyncStatus('error', err);  
 render();  
 })  
 .saveOrderStartRow(SESSION.token, { id: row.id, fields: fields });  
}  
  
function retrySave(id){  
 const row = ROWS.find(r => r.id === id);  
 if (row) pushSave(row);  
}  
  
function setSyncStatus(state, msg){  
 const el = document.getElementById('syncStatus');  
 el.className = 'sync-status ' + state;  
 if (el) el.style.display = 'none';  
 if (msg) el.title = state === 'error' ? '클릭하여 서버 재연결 시도 (' + String(msg) + ')' : '';  
}  
function retryAllSync(){  
 const el = document.getElementById('syncStatus');  
 if(el.className.includes('ok') || el.className.includes('saving')) return;  
   
// 저장 중 통신이 끊겨 에러가 난 데이터가 있으면 다시 저장 시도  
 let hasError = false;  
 if (typeof ROWS !== 'undefined') ROWS.filter(r => r._syncError).forEach(r => { hasError = true; pushSave(r); });  
 if (typeof CANCEL_ROWS !== 'undefined') CANCEL_ROWS.filter(r => r._syncError).forEach(r => { hasError = true; pushSaveCancel(r); });  
 if (typeof PRICE_ROWS !== 'undefined') PRICE_ROWS.filter(r => r._syncError).forEach(r => { hasError = true; pushSavePrice(r); });  
 if (typeof RESTART_ROWS !== 'undefined') RESTART_ROWS.filter(r => r._syncError).forEach(r => { hasError = true; pushSaveRestart(r); });  
   
// 에러난 데이터가 없는데 미연결 상태면 현재 탭 데이터 새로고침  
 if(!hasError) {  
 if(currentTab === 'order_start') loadData();  
 else if(currentTab === 'cancel') loadCancelData();  
 else if(currentTab === 'price_change') loadPriceData();  
 else if(currentTab === 'restart') loadRestartData();  
 }  
}  
  
/* ===================== 삭제 ===================== */  
function deleteRow(id){  
 if (!confirm('이 건을 삭제하시겠습니까? 삭제하면 복구할 수 없습니다.')) return;  
 const idx = ROWS.findIndex(r => r.id === id);  
 if (idx === -1) return;  
 const removed = ROWS[idx];  
 ROWS.splice(idx, 1);  
 render();  
 setSyncStatus('saving');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) {  
 setSyncStatus('ok'); onDataChanged_('order');  
 } else {  
 ROWS.splice(idx, 0, removed);  
 setSyncStatus('error', res && res.error);  
 render();  
 alert('삭제 실패: ' + (res && res.error ? res.error : '알 수 없는 오류'));  
 }  
 })  
 .withFailureHandler(function(err){  
 ROWS.splice(idx, 0, removed);  
 setSyncStatus('error', err);  
 render();  
 alert('삭제 실패: ' + err);  
 })  
 .deleteOrderStartRow(SESSION.token, id);  
}  
  
/* ===================== 신규 등록 (별도 모달) ===================== */  
const FIELD_DEFS = [  
 { key:'계약번호', label:'계약번호', type:'text', placeholder:'N1234567 또는 미확정 시 N' },  
 { key:'계약처명', label:'계약처명', type:'text' },  
 { key:'영업담당', label:'영업담당', type:'select', options:LIST_SALES_REP },  
 { key:'영업동기', label:'영업동기', type:'select', options:LIST_MOTIVE },  
 { key:'담당차량', label:'담당차량', type:'select', options:LIST_CAR },  
 { key:'보고일', label:'보고일', type:'date' },  
 { key:'계약일', label:'계약일', type:'date' },  
 { key:'개시일', label:'개시일', type:'date' },  
 { key:'기산일', label:'기산일', type:'text', placeholder:'YYYY-MM-DD 또는 미정' },  
 { key:'용역료', label:'용역료(원)', type:'money' },  
 { key:'상품', label:'상품', type:'select', options:LIST_PRODUCT },  
 { key:'그로스', label:'그로스', type:'select', options:LIST_GROSS },  
 { key:'비고', label:'비고', type:'textarea', full:true }  
];  
  
function buildForm(){  
 const el = document.getElementById('formFields');  
 el.innerHTML = FIELD_DEFS.map(f => {  
 let input;  
 if (f.type === 'select') {  
 input = `<select id="f_${f.key}"><option value="">선택</option>${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;  
 } else if (f.type === 'textarea') {  
 input = `<textarea id="f_${f.key}" rows="2"></textarea>`;  
 } else if (f.type === 'money') {  
 input = `<input type="text" inputmode="numeric" id="f_${f.key}" oninput="formatMoneyInput(this)" ${f.placeholder?`placeholder="${f.placeholder}"`:''}>`;  
 } else {  
 input = `<input type="${f.type}" id="f_${f.key}" ${f.placeholder?`placeholder="${f.placeholder}"`:''}>`;  
 }  
 return `<div class="field ${f.full?'full':''}"><label>${f.label}</label>${input}<div class="err" id="err_${f.key}"></div></div>`;  
 }).join('');  
 updateAutoPreview();  
 FIELD_DEFS.forEach(f => { const e = document.getElementById('f_'+f.key); if (e) e.addEventListener('input', updateAutoPreview); });  
}  
  
function collectFormValues(){  
 const row = {};  
 FIELD_DEFS.forEach(f => {  
 const e = document.getElementById('f_'+f.key);  
 if (!e) { row[f.key] = ''; return; }  
 row[f.key] = f.type === 'money' ? e.value.replace(/[^0-9]/g,'') : e.value.trim();  
 });  
 return row;  
}  
  
/** 수주개시 신규 등록 폼 디폴트 값 */  
function applyOrderStartDefaults(){  
 const repDefault = LIST_SALES_REP.includes(SESSION.name) ? SESSION.name : (SETTINGS_DEFAULTS.영업컨설턴트 || '최영국');  
 const today = todayStr();  
 const startDefault = nextBusinessDay(addDaysStr(today, 7));

 setVal('영업담당', repDefault);

 setVal('담당차량', 127);  
 setVal('보고일', today);  
 setVal('계약일', today);  
 setVal('개시일', startDefault);  
 setVal('기산일', startDefault);  
 setVal('상품', '알람');  
 setVal('그로스', '일반');  
}  
  
function updateAutoPreview(){  
 const row = collectFormValues();  
 const auto = computeAutoFields(row);  
 document.getElementById('autoPreview').innerText =  
 `자동계산 → 개시확정: ${auto.개시확정} | 수주월: ${auto.수주월||'-'} | 개시월: ${auto.개시월} | 이월: ${auto.이월} | 구분: ${auto.구분||'-'}`;  
}  
  
function clearErrors(){ FIELD_DEFS.forEach(f => { const e = document.getElementById('err_'+f.key); if (e) e.innerText=''; }); }  
function setError(key,msg){ const e = document.getElementById('err_'+key); if (e) e.innerText = msg; }  
  
function validateRow(row){  
 let ok = true;  
 clearErrors();  
 if (row.계약번호 && !(row.계약번호 === 'N' || /^N\d{7,8}$/.test(row.계약번호))) { setError('계약번호','N 단독 또는 N+숫자 7~8자리로 입력하세요.'); ok = false; }  
 if (!row.계약번호) { setError('계약번호','필수 입력입니다.'); ok = false; }  
 if (!row.계약처명) { setError('계약처명','필수 입력입니다.'); ok = false; }  
 if (!row.보고일) { setError('보고일','필수 입력입니다.'); ok = false; }  
 if (row.계약일) {  
 if (row.보고일 && row.계약일 < row.보고일) { setError('계약일','보고일과 같거나 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.계약일)) { setError('계약일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 if (row.개시일) {  
 if (row.계약일 && row.개시일 < row.계약일) { setError('개시일','계약일 포함 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.개시일)) { setError('개시일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 if (row.기산일 && row.기산일 !== '미정') {  
 if (!/^\d{4}-\d{2}-\d{2}$/.test(row.기산일)) { setError('기산일','YYYY-MM-DD 형식이거나 "미정"만 입력 가능합니다.'); ok = false; }  
 else if (row.개시일 && row.기산일 < row.개시일) { setError('기산일','개시일 포함 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.기산일)) { setError('기산일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 return ok;  
}  
  
function openAddModal(){  
 buildForm();  
 applyOrderStartDefaults();  
 updateAutoPreview();  
 document.getElementById('modalOverlay').classList.add('open');  
}  
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }  
  
function submitNewRow(){  
 const fields = collectFormValues();  
 if (!validateRow(fields)) return;     
 const saveBtn = document.querySelector('#modalOverlay button.primary') || document.querySelector('#modalOverlay button:last-child');
 if (saveBtn) { saveBtn.disabled = true; saveBtn.innerText = 'DB 저장 중...'; }
 setSyncStatus('saving');  
 google.script.run  
 .withSuccessHandler(function(res){  
   if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = '저장'; }
   if (res && res.success) {  
     closeModal();
     setSyncStatus('ok');  
     alert('✓ DB에 정상 등록되었습니다.');
     const rowYm = (fields['기산일'] && fields['기산일'] !== '미정') ? fields['기산일'].slice(0, 7) : (fields['계약일'] ? fields['계약일'].slice(0, 7) : '');
     const ymInput = document.getElementById('ymFilterOrder');
     if (rowYm && ymInput && ymInput.value && ymInput.value !== rowYm && ymInput.value !== 'ALL') {
       ymInput.value = rowYm;
     }
     clearScopeCacheKeys_('orderStartData_');
     loadData(false);
     onDataChanged_('order');
   } else {  
     setSyncStatus('error', res && res.error);  
     alert('⚠️ DB 등록 실패: ' + (res && res.error ? res.error : '알 수 없는 오류'));  
   }  
 })  
 .withFailureHandler(function(err){  
   if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = '저장'; }
   setSyncStatus('error', err);  
   alert('⚠️ DB 등록 통신 실패: ' + err);  
 })  
 .saveOrderStartRow(SESSION.token, { id: null, fields: fields });  
}  
  
/* ===================== 해약중지 ===================== */  
const CANCEL_HEADERS = ['구분','기준','해약월','계약번호','계약처명','영업담당','담당차량','접수일','확정일','용역료','상품','그로스','해약유형','유형','사유'];  
const CANCEL_EDITABLE_FIELDS = ['계약번호','계약처명','영업담당','담당차량','접수일','확정일','용역료','상품','그로스','해약유형','유형','사유'];  
const CANCEL_AUTO_FIELDS = ['구분','기준','해약월'];  
  
const LIST_CANCEL_SALES_REP = ['최영국','이수열','박광춘','정문재','임영민'];  
const LIST_CANCEL_CAR = [26,27,28,127,160,'없음'];  
const LIST_CANCEL_TYPE = ['폐업','타사전환','관외이전','관내이전','통합','공사','경비절감','고객사망','중지'];  
// LIST_REG_TYPE은 파일 상단(수주개시 설정값 부근)에서 이미 선언됨(수주개시/해약중지/인상인하 공통 사용).  
  
const CANCEL_FIELD_TYPE = {  
 계약번호:'text', 계약처명:'text', 영업담당:'select', 담당차량:'select',  
 접수일:'date', 확정일:'text', 용역료:'number', 상품:'select', 그로스:'select',  
 해약유형:'select', 유형:'select', 사유:'text'  
};  
const CANCEL_FIELD_OPTIONS = {  
 영업담당:LIST_CANCEL_SALES_REP, 담당차량:LIST_CANCEL_CAR, 상품:LIST_PRODUCT, 그로스:LIST_GROSS,  
 해약유형:LIST_CANCEL_TYPE, 유형:LIST_REG_TYPE  
};  
  
let CANCEL_ROWS = [];  
let cancelSortState = { key:'확정일', dir:'asc' };  
  
function computeAutoCancel(row){  
 const today = todayStr();  
 if (!row.접수일) return { 구분:'', 기준:'', 해약월:'' };  
 let 기준, 해약월;  
 const 확정일 = row.확정일;  
 if (확정일 === '미정') { 기준 = '미정'; 해약월 = '미정'; }  
 else if (확정일 === '해약방어') { 기준 = '방어'; 해약월 = '해약방어'; }  
 else if (!확정일) { 기준 = ''; 해약월 = ''; }  
 else {  
 const ym = yyyymm(확정일);  
 기준 = (ym === yyyymm(today)) ? '당월' : '이월';  
 해약월 = ym;  
 }  
 const 해약유형 = row.해약유형 || '';  
 const 구분 = 해약유형.indexOf('중지') !== -1 ? '중지' : '해약';  
 return { 구분, 기준, 해약월 };  
}  
function statusClassCancel(v){  
 if (v === '당월') return 'status-confirmed';  
 if (v === '이월') return 'status-scheduled';  
 if (v === '미정') return 'status-unknown';  
 if (v === '방어') return 'status-defense';  
 return '';  
}  
  
function loadCancelData(silent){  
 const yearMonth = getYmFilterVal_('cancel');  
 const cacheKey = 'cancelData_' + yearMonth;  
 const myGen = nextLoadGen_('cancel');  
 const cached = cacheGet_(cacheKey, GRID_CACHE_TTL_MS_);  
 if (cached) {  
 CANCEL_ROWS = cached.rows.map(r => {  
 const obj = { id: r[r.length-1] };  
 CANCEL_HEADERS.forEach((h,i) => obj[h] = r[i]);  
 return obj;  
 });  
 SCOPE_LOADED_.cancel = true;  
 STALE_SCOPES_.delete('cancel'); updateManualRefreshBtn_();  
 if (!silent) renderCancel();  
 return;  
 }  
 if (!silent) { showLoadingProgress_('content', '데이터를 불러오는 중입니다...', 'loadCancelData'); setLoadingCursor(true); }  
 google.script.run  
 .withSuccessHandler(function(data){  
 if (isStaleLoadGen_('cancel', myGen)) return; // 이미 더 최근 요청이 나가있으면 이 늦은 응답은 무시  
 if (!silent) setLoadingCursor(false);  
 if (data && data.error) { if (!silent) showLogin(data.error); return; }  
 cacheSet_(cacheKey, data);  
 CANCEL_ROWS = data.rows.map(r => {  
 const obj = { id: r[r.length-1] };  
 CANCEL_HEADERS.forEach((h,i) => obj[h] = r[i]);  
 return obj;  
 });  
 SCOPE_LOADED_.cancel = true;  
 STALE_SCOPES_.delete('cancel'); updateManualRefreshBtn_();  
 if (!silent) renderCancel();  
 })  
 .withFailureHandler(function(err){  
 if (isStaleLoadGen_('cancel', myGen)) return;  
 if (!silent) { setLoadingCursor(false); document.getElementById('content').innerHTML = '<div class="loading">데이터 로드 실패: ' + err + '</div>'; }  
 })  
 .getCancelData(SESSION.token, yearMonth);  
}  
  
function sortedCancelRows(){  
 const filterText = (document.getElementById('cancelSearchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterCancel')||{}).value || '';  
 let list = CANCEL_ROWS.map(r => Object.assign({}, r, computeAutoCancel(r)));  
 if (filterText) list = list.filter(r => String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 if (repFilter) list = list.filter(r => r.영업담당 === repFilter);  
  
 if (chkVal('onlyPendingCancel', true)) list = list.filter(r => isPendingDate(r.확정일));  
 if (chkVal('excludeGrossCancel', false)) list = list.filter(r => String(r.그로스 || '').trim() === '일반');  
 const key = cancelSortState.key, dir = cancelSortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) => {  
 let va = a[key], vb = b[key];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (key === '용역료') { va = Number(va); vb = Number(vb); }  
 if (va < vb) return -1 * dir;  
 if (va > vb) return 1 * dir;  
 return 0;  
 });  
 return list;  
}  
function setCancelSort(key){  
 if (cancelSortState.key === key) cancelSortState.dir = cancelSortState.dir === 'asc' ? 'desc' : 'asc';  
 else { cancelSortState.key = key; cancelSortState.dir = 'asc'; }  
 renderCancel();  
}  
function headerCellCancel(h){  
 const arrow = cancelSortState.key === h ? (cancelSortState.dir === 'asc' ? '▲' : '▼') : '';  
 const sw = localStorage.getItem('colw_cancel_' + h);  
 const style = sw ? ` style="width:${sw}px; min-width:${sw}px;"` : '';  
 return `<th${style} onclick="setCancelSort('${h}')">${h}<span class="arrow">${arrow}</span><div class="col-resizer" onclick="event.stopPropagation()" onmousedown="initColResize(event, 'cancel', '${h}')"></div></th>`;  
}  
  
const CANCEL_DATE_FIELDS = ['접수일','확정일'];  
  
function cancelCellClass(field, val, allRows){  
 let cls = '';  
 if (field === '계약번호' || field === '상품' || field === '그로스') cls = 'contract-cell' + (contractCellBad(val, allRows, '계약번호') ? ' contract-bad' : '');  
 else if (field === '계약처명') cls = 'name-cell';  
 else if (field === '용역료') cls = 'fee money num';  
 else if (field === '담당차량') cls = 'center center-cell narrow';  
 else if (CANCEL_DATE_FIELDS.indexOf(field) !== -1) cls = 'datecol';  
 else if (field === '사유') cls = 'wide-note';  
 else if (field === '유형' || field === '영업담당') cls = 'narrow';  
 if (field === '그로스' && String(val) === '법인') cls += ' gross-corp';  
 if (field === '상품') cls += productCellClass_(val);  
 if (field === '확정일' && String(val) === todayStr()) cls += ' today-hl';  
 else if (cancelSortState.key === field) cls += ' sort-col';  
 return cls.trim();  
}  
  
function fieldCellHtmlCancel(row, field, allRows){  
 const val = row[field] !== undefined && row[field] !== null ? row[field] : '';  
 let cls = cancelCellClass(field, val, allRows);  
 let disp;  
 const isDateField = CANCEL_DATE_FIELDS.indexOf(field) !== -1;  
 if (field === '용역료') disp = commaFmt(val);  
 else if (isDateField) disp = fmtMD(val);  
 else disp = val;  
 const titleAttr = (field === '계약처명' || field === '사유' || isDateField) ? ` title="${escAttr(val)}"` : '';  
 if (isDateField) {  
 cls += ' date-editable';  
 return `<td class="${cls}"${titleAttr} data-scope="cancel" data-id="${escAttr(row.id)}" data-field="${escAttr(field)}" data-val="${escAttr(val)}" onclick="openDateEditPopup_(this)">${escHtml(disp)}</td>`;  
 }  
 return `<td class="${cls}"${titleAttr}>${escHtml(disp)}</td>`;  
}  
  
function renderCancel(){  
 const rows = sortedCancelRows();  
 let html = '<div class="grid-wrap"><table><thead><tr>' + flagHeaderHtml('cancel');  
 CANCEL_HEADERS.forEach(h => html += headerCellCancel(h));  
 html += '</tr></thead><tbody>';  
  
 rows.forEach(row => {  
 const rowCls = ((row._syncError ? 'sync-error' : (row._unsynced ? 'unsynced' : '')) + flagRowClass('cancel', row.id)).trim();  
 html += `<tr data-id="${row.id}" class="${rowCls}">` + flagCellHtml('cancel', row.id);  
 CANCEL_HEADERS.forEach(h => {  
 if (CANCEL_AUTO_FIELDS.includes(h)) {  
 const isMonth = (h === '해약월');  
 const disp = isMonth ? fmtMonth(row[h]) : row[h];  
 const autoCls = ('auto ' + statusClassCancel(row[h]) + (isMonth ? ' monthcol' : '') + (cancelSortState.key === h ? ' sort-col' : '')).trim();  
 html += `<td class="${autoCls}">${escHtml(disp)}</td>`;  
 } else html += fieldCellHtmlCancel(row, h, rows);  
 });  
 html += '</tr>';  
 });  
  
 html += '</tbody></table></div>';  
 document.getElementById('content').innerHTML = html;  
 document.getElementById('cancelRowCount').innerText = `총 ${rows.length}건`;  
 document.getElementById('rowSumCancel').innerText = flaggedSumText_(rows, '용역료');  
 updateCopyButtonState_('cancel', rows);  
}  
  
function onCancelFieldChange(id, field, value){  
 const row = CANCEL_ROWS.find(r => r.id === id);  
 if (!row) return;  
 row[field] = value;  
 row._unsynced = true; row._syncError = false;  
 renderCancel();  
 pushSaveCancel(row);  
}  
function pushSaveCancel(row){  
 setSyncStatus('saving');  
 const fields = {};  
 CANCEL_EDITABLE_FIELDS.forEach(f => fields[f] = row[f] !== undefined ? row[f] : '');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) { row._unsynced = false; row._syncError = false; setSyncStatus('ok'); onDataChanged_('cancel'); }  
 else { row._syncError = true; setSyncStatus('error', res && res.error); handleSessionExpiry(res); }  
 renderCancel();  
 })  
 .withFailureHandler(function(err){ row._syncError = true; setSyncStatus('error', err); renderCancel(); })  
 .saveCancelRow(SESSION.token, { id: row.id, fields: fields });  
}  
function retrySaveCancel(id){ const row = CANCEL_ROWS.find(r => r.id === id); if (row) pushSaveCancel(row); }  
  
function deleteCancelGridRow(id){  
 if (!confirm('이 건을 삭제하시겠습니까? 삭제하면 복구할 수 없습니다.')) return;  
 const idx = CANCEL_ROWS.findIndex(r => r.id === id);  
 if (idx === -1) return;  
 const removed = CANCEL_ROWS[idx];  
 CANCEL_ROWS.splice(idx, 1);  
 renderCancel();  
 setSyncStatus('saving');  
 google.script.run  
 .withSuccessHandler(function(res){

function computeAutoPrice(row){  
 const today = todayStr();  
 const amount = row.금액 === '' || row.금액 === undefined || row.금액 === null ? null : Number(row.금액);  
 if (amount === null || isNaN(amount)) return { 구분:'', 기준:'', 반영월:'', 인상인하율:'' };  
 const 구분 = amount < 0 ? '인하' : '인상';  
 let 기준, 반영월;  
 const 기산일 = row.기산일;  
 if (기산일 === '미정') { 기준 = '미정'; 반영월 = '미정'; }  
 else if (!기산일) { 기준 = ''; 반영월 = ''; }  
 else {  
 const ym = yyyymm(기산일);  
 기준 = (ym === yyyymm(today)) ? '당월' : '이월';  
 반영월 = ym;  
 }  
 const before = Number(row.現용역료);  
 const 인상인하율 = (row.現용역료 && before !== 0 && !isNaN(before)) ? ((amount / before * 100).toFixed(1) + '%') : '';  
 return { 구분, 기준, 반영월, 인상인하율 };  
}

}

function sortedPriceRows(){  
 const filterText = (document.getElementById('priceSearchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterPrice')||{}).value || '';  
 const typeFilterEl = document.querySelector('input[name="priceTypeFilter"]:checked');  
 const typeFilter = typeFilterEl ? typeFilterEl.value : '';  
 let list = PRICE_ROWS.map(r => Object.assign({}, r, computeAutoPrice(r)));  
 if (filterText) list = list.filter(r => String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 if (repFilter) list = list.filter(r => r.영업담당 === repFilter);  
 if (typeFilter) list = list.filter(r => r.구분 === typeFilter);  
 if (chkVal('onlyPendingPrice', true)) list = list.filter(r => isPendingDate(r.기산일));  
 if (chkVal('excludeGrossPrice', false)) list = list.filter(r => String(r.그로스 || '').trim() === '일반');  
 const key = priceSortState.key, dir = priceSortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) => {  
 let va = a[key], vb = b[key];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (key === '금액' || key === '現용역료') { va = Number(va); vb = Number(vb); }  
 if (va < vb) return -1 * dir;  
 if (va > vb) return 1 * dir;  
 return 0;  
 });  
 return list;  
}  
function setPriceSort(key){

}

}  
const PRICE_DATE_FIELDS = ['접수일','기산일'];  
  
function priceCellClass(field, val, allRows){  
 let cls = '';  
 if (field === '계약번호' || field === '상품' || field === '그로스') cls = 'contract-cell' + (contractCellBad(val, allRows, '계약번호') ? ' contract-bad' : '');  
 else if (field === '계약처명') cls = 'name-cell';  
 else if (field === '비고') cls = 'wide-note';  
 else if (field === '現용역료') cls = 'money-black num';

 else if (field === '금액') {  
 const n = Number(val);  
 const up = (!isNaN(n) && val !== '') ? (n >= 0) : null;  
 cls = up === null ? 'money num' : (up ? 'amt-up pcbg-up num' : 'amt-down pcbg-down num');

function fieldCellHtmlPrice(row, field, allRows){

function validatePriceRow(row){  
 let ok = true;  
 clearPriceErrors();  
 if (!row.계약번호 || !/^N\d{7,8}$/.test(row.계약번호)) { setPriceError('계약번호','N으로 시작하는 7~8자리 코드로 입력하세요.'); ok = false; }  
 if (!row.계약처명) { setPriceError('계약처명','필수 입력입니다.'); ok = false; }  
 if (row.금액 === '' || isNaN(Number(row.금액))) { setPriceError('금액','숫자를 입력하세요.'); ok = false; }  
 if (row.기산일 && row.기산일 !== '미정') {  
 if (!/^\d{4}-\d{2}-\d{2}$/.test(row.기산일)) { setPriceError('기산일','YYYY-MM-DD 형식이거나 "미정"만 입력 가능합니다.'); ok = false; }  
 else if (row.접수일 && row.기산일 < row.접수일) { setPriceError('기산일','접수일 포함 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.기산일)) { setPriceError('기산일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 return ok;  
}

 if (cached) {
