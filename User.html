function sortedRestartRows(){  
 const filterText = (document.getElementById('restartSearchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterRestart')||{}).value || '';  
 let list = RESTART_ROWS.map(r => Object.assign({}, r, computeAutoRestart(r)));  
 if (filterText) list = list.filter(r => String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 if (repFilter) list = list.filter(r => r.영업담당 === repFilter);  
 if (chkVal('onlyStoppedRestart', false)) list = list.filter(r => String(r.현상태||'') === '중지');  
 if (chkVal('excludeGrossRestart', false)) list = list.filter(r => String(r.그로스 || '').trim() === '일반');  
 const key = restartSortState.key, dir = restartSortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) => {  
 let va = a[key], vb = b[key];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (key === '용역료') { va = Number(va); vb = Number(vb); }  
 if (va < vb) return -1 * dir;  
 if (va > vb) return 1 * dir;  
 return 0;  
 });  
 return list;  
}  
function setRestartSort(key){  
 if (restartSortState.key === key) restartSortState.dir = restartSortState.dir === 'asc' ? 'desc' : 'asc';  
 else { restartSortState.key = key; restartSortState.dir = 'asc'; }  
 renderRestart();  
}  
function headerCellRestart(h){  
 const arrow = restartSortState.key === h ? (restartSortState.dir === 'asc' ? '▲' : '▼') : '';  
 const sw = localStorage.getItem('colw_restart_' + h);  
 const style = sw ? ` style="width:${sw}px; min-width:${sw}px;"` : '';  
 return `<th${style} onclick="setRestartSort('${h}')">${h}<span class="arrow">${arrow}</span><div class="col-resizer" onclick="event.stopPropagation()" onmousedown="initColResize(event, 'restart', '${h}')"></div></th>`;  
}  
const RESTART_DATE_FIELDS = ['재개시일','중지일'];  
  
function restartCellClass(field, val, allRows){  
 let cls = '';  
 if (field === '계약번호' || field === '상품' || field === '그로스') cls = 'contract-cell' + (contractCellBad(val, allRows, '계약번호') ? ' contract-bad' : '');  
 else if (field === '계약처명') cls = 'name-cell';  
 else if (field === '비고') cls = 'wide-note';  
 else if (field === '용역료') cls = 'fee money num';  
 else if (field === '담당차량') cls = 'center center-cell narrow';  
 if (RESTART_DATE_FIELDS.indexOf(field) !== -1) cls += ' datecol';  
 if (['현상태','공사담당','영업담당'].indexOf(field) !== -1) cls += ' narrow';  
 if (field === '그로스' && String(val) === '법인') cls += ' gross-corp';  
 if (field === '상품') cls += productCellClass_(val);  
 if (field === '재개시일' && String(val) === todayStr()) cls += ' today-hl';  
 else if (restartSortState.key === field) cls += ' sort-col';  
 return cls.trim();  
}  
  
function fieldCellHtmlRestart(row, field, allRows){  
 const val = row[field] !== undefined && row[field] !== null ? row[field] : '';  
 let cls = restartCellClass(field, val, allRows);  
 let disp;  
 const isDateField = RESTART_DATE_FIELDS.indexOf(field) !== -1;  
 if (field === '용역료') disp = commaFmt(val);  
 else if (isDateField) disp = fmtMD(val);  
 else disp = val;  
 const titleAttr = (field === '계약처명' || field === '비고' || isDateField) ? ` title="${escAttr(val)}"` : '';  
 if (isDateField) {  
 cls += ' date-editable';  
 return `<td class="${cls}"${titleAttr} data-scope="restart" data-id="${escAttr(row.id)}" data-field="${escAttr(field)}" data-val="${escAttr(val)}" onclick="openDateEditPopup_(this)">${escHtml(disp)}</td>`;  
 }  
 return `<td class="${cls}"${titleAttr}>${escHtml(disp)}</td>`;  
}  
  
function renderRestart(){  
 const rows = sortedRestartRows();  
 let html = '<div class="grid-wrap"><table><thead><tr>' + flagHeaderHtml('restart');  
 RESTART_HEADERS.forEach(h => html += headerCellRestart(h));  
 html += '</tr></thead><tbody>';  
 rows.forEach(row => {  
 const rowCls = ((row._syncError ? 'sync-error' : (row._unsynced ? 'unsynced' : '')) + flagRowClass('restart', row.id)).trim();  
 html += `<tr data-id="${row.id}" class="${rowCls}">` + flagCellHtml('restart', row.id);  
 RESTART_HEADERS.forEach(h => {  
 if (RESTART_AUTO_FIELDS.includes(h)) {  
 const disp = (h === '재개시월') ? fmtMonth(row[h]) : row[h];  
 const autoCls = ('auto monthcol' + (restartSortState.key === h ? ' sort-col' : '')).trim();  
 html += `<td class="${autoCls}">${escHtml(disp)}</td>`;  
 } else html += fieldCellHtmlRestart(row, h, rows);  
 });  
 html += '</tr>';  
 });  
 html += '</tbody></table></div>';  
 document.getElementById('content').innerHTML = html;  
 document.getElementById('restartRowCount').innerText = `총 ${rows.length}건`;  
 document.getElementById('rowSumRestart').innerText = flaggedSumText_(rows, '용역료');  
 updateCopyButtonState_('restart', rows);  
}

function productDailySummaryTableHtml_(){  
 const ymNow = productDailySummaryYm;  
 const yearNum = Number(ymNow.slice(0,4));  
 const monthNum = Number(ymNow.slice(5,7));  
 const forecastStr = String(yearNum).slice(2) + '.' + String(monthNum).padStart(2,'0') + '월';  
 const sumBy = (pred) => PRODUCT_DAILY_ROWS.filter(pred).reduce((s,r) => s + (Number(String(r.합계||'0').replace(/,/g,'')) || 0), 0);  
 // 2026-09-18: "카드매출" 입력값(월별 단일 금액, 원단위) - 지사 몫의 매출에만 더해진다(수주에는 반영하지 않음).  
 const cardSales = Number((PRODUCT_DAILY_SUMMARY_EXTRA && PRODUCT_DAILY_SUMMARY_EXTRA.카드매출) || 0);  
  
 const ord지사 = sumBy(r => r.구분 === '지사' && String(r.보고일||'').slice(0,7) === ymNow);  
 const ord법인 = sumBy(r => r.구분 === '법인' && String(r.보고일||'').slice(0,7) === ymNow);  
 const ord계 = ord지사 + ord법인;  
 const ord잔략협력 = sumBy(r => r.구분 === '전략' && String(r.보고일||'').slice(0,7) === ymNow);  
 const ord합계 = ord계 + ord잔략협력;  
  
 const saleConfirmedOk = r => productDailySummaryIncludeUnconfirmed || r.매출여부 === '매출';  
 const sale지사 = sumBy(r => r.구분 === '지사' && r.매출예상 === forecastStr && saleConfirmedOk(r)) + cardSales;  
 const sale법인 = sumBy(r => r.구분 === '법인' && r.매출예상 === forecastStr && saleConfirmedOk(r));  
 const sale계 = sale지사 + sale법인;  
 const sale잔략협력 = sumBy(r => r.구분 === '전략' && r.매출예상 === forecastStr && saleConfirmedOk(r));  
 const sale합계 = sale계 + sale잔략협력;  
  
 const summary = PRODUCT_DAILY_SUMMARY_EXTRA || {};  
 const tgt = summary.목표 || {}, pln = summary.계획 || {};  
 const ordTarget = (Number(tgt.수주) || 0) * 1000; // 목표/계획은 천원 단위로 저장되므로 원 단위로 환산

function loadProductDailyData(silent){  
 const cacheKey = 'productDailyData';  
 const cached = cacheGet_(cacheKey, GRID_CACHE_TTL_MS_);  
 if (cached) {  
 PRODUCT_DAILY_ROWS = cached.rows.map(r => {  
 const obj = { id: r[r.length-1] };  
 PRODUCT_DAILY_HEADERS.forEach((h,i) => obj[h] = r[i]);  
 return obj;  
 });  
 SCOPE_LOADED_.productdaily = true;  
 STALE_SCOPES_.delete('productdaily'); updateManualRefreshBtn_();  
 if (!silent) loadProductDailySummaryTarget_(function(){ renderProductDaily(); });  
 return;  
 }  
 if (!silent) { showLoadingProgress_('content', '데이터를 불러오는 중입니다...', 'loadProductDailyData'); setLoadingCursor(true); }  
 google.script.run  
 .withSuccessHandler(function(data){  
 if (!silent) setLoadingCursor(false);  
 if (data && data.error) { if (!silent) showLogin(data.error); return; }  
 cacheSet_(cacheKey, data);  
 PRODUCT_DAILY_ROWS = data.rows.map(r => {  
 const obj = { id: r[r.length-1] };  
 PRODUCT_DAILY_HEADERS.forEach((h,i) => obj[h] = r[i]);  
 return obj;  
 });  
 SCOPE_LOADED_.productdaily = true;  
 STALE_SCOPES_.delete('productdaily'); updateManualRefreshBtn_();  
 if (!silent) loadProductDailySummaryTarget_(function(){ renderProductDaily(); });  
 })  
 .withFailureHandler(function(err){ if (!silent) { setLoadingCursor(false); document.getElementById('content').innerHTML = '<div class="loading">데이터 로드 실패: ' + err + '</div>'; } })  
 .getProductDailyData(SESSION.token);  
}  
  
function sortedProductDailyRows(){  
 const filterText = (document.getElementById('productDailySearchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterProductDaily')||{}).value || '';  
 const gubunFilter = (document.getElementById('gubunFilterProductDaily')||{}).value || '';  
 const ymFilter = (document.getElementById('ymFilterProductDaily')||{}).value || productDailySummaryYm;  
 let list = PRODUCT_DAILY_ROWS.map(r => Object.assign({}, r, computeAutoProductDaily(r)));  
 if (filterText) list = list.filter(r => String(r.서비스제공처||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 if (repFilter) list = list.filter(r => r.계약담당자 === repFilter);  
 if (gubunFilter) list = list.filter(r => r.구분 === gubunFilter);  
 if (!productDailySummaryIncludeUnconfirmed) list = list.filter(r => String(r.매출여부||'') === '매출');  
 if (ymFilter) {  
   const yNum = Number(ymFilter.slice(0, 4)), mNum = Number(ymFilter.slice(5, 7));  
   list = list.filter(r => String(r.보고일||'').slice(0, 7) === ymFilter || matchForecastMonth_(r.매출예상, yNum, mNum));  
 }  
 const key = productDailySortState.key, dir = productDailySortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) => {  
 let va = a[key], vb = b[key];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (['계약설치비','계약기기비','합계'].indexOf(key) !== -1) { va = Number(String(va).replace(/,/g,'')); vb = Number(String(vb).replace(/,/g,'')); }  
 if (va < vb) return -1 * dir;  
 if (va > vb) return 1 * dir;  
 return 0;  
 });  
 return list;  
}  
function setProductDailySort(key){  
 if (productDailySortState.key === key) productDailySortState.dir = productDailySortState.dir === 'asc' ? 'desc' : 'asc';  
 else { productDailySortState.key = key; productDailySortState.dir = 'asc'; }  
 renderProductDaily();  
}  
function headerCellProductDaily(h){  
 const arrow = productDailySortState.key === h ? (productDailySortState.dir === 'asc' ? '▲' : '▼') : '';  
 const sw = localStorage.getItem('colw_productdaily_' + h);  
 const style = sw ? ` style="width:${sw}px; min-width:${sw}px;"` : '';  
 return `<th${style} onclick="setProductDailySort('${h}')">${h}<span class="arrow">${arrow}</span><div class="col-resizer" onclick="event.stopPropagation()" onmousedown="initColResize(event, 'productdaily', '${h}')"></div></th>`;  
}  
const PRODUCT_DAILY_DATE_FIELDS = ['보고일'];  
  
function productDailyContractBad(val, allRows){  
  const s = String(val === null || val === undefined ? '' : val).trim();  
  if (!s || s === 'T' || s === 'N') return false;  
  const sUpper = s.toUpperCase();  
  let cnt = 0;  
  for (let i = 0; i < allRows.length; i++) {  
    const other = String(allRows[i].계약번호 === null || allRows[i].계약번호 === undefined ? '' : allRows[i].계약번호).trim().toUpperCase();  
    if (other && other !== 'T' && other !== 'N' && other === sUpper) cnt++;  
    if (cnt > 1) return true;  
  }  
  return false;  
}  
function productDailyMotiveStyle(val){  
 const s = String(val||'');  
 if (s === '신규') return 'color:rgb(0,100,0); background-color:rgb(200,250,200);';  
 if (s === '변추가') return 'color:rgb(156,100,0); background-color:rgb(255,255,150);';  
 if (s === '안전상품A/S') return 'color:blue; background-color:#ffffff;';  
 return '';  
}  
function productDailyCellClass(field, val, allRows){  
 let cls = '';  
 if (field === '계약번호' || field === '상품' || field === '그로스') cls = 'contract-cell' + (productDailyContractBad(val, allRows) ? ' contract-bad' : '');  
 else if (field === '서비스제공처') cls = 'name-cell';  
 else if (field === '계약설치비' || field === '계약기기비') cls = 'fee money num';  
 if (PRODUCT_DAILY_DATE_FIELDS.indexOf(field) !== -1) cls += ' datecol';  
 if (['계약담당자','구분','매출여부'].indexOf(field) !== -1) cls += ' narrow';  
 if (field === '구분' && String(val) === '법인') cls += ' gross-corp';  
 if (field === '매출여부' && String(val) === '미매출') cls += ' pc-down';  
 if (productDailySortState.key === field) cls += ' sort-col';  
 return cls.trim();  
}  
  
function fieldCellHtmlProductDaily(row, field, allRows){  
 const val = row[field] !== undefined && row[field] !== null ? row[field] : '';  
 const cls = productDailyCellClass(field, val, allRows);  
 let disp;  
 if (field === '계약설치비' || field === '계약기기비') disp = commaFmt(val);  
 else if (PRODUCT_DAILY_DATE_FIELDS.indexOf(field) !== -1) disp = fmtMD(val);  
 else disp = val;  
 const titleAttr = (field === '서비스제공처' || PRODUCT_DAILY_DATE_FIELDS.indexOf(field) !== -1) ? ` title="${escAttr(val)}"` : '';  
 const tdStyle = (field === '계약동기') ? ` style="${productDailyMotiveStyle(val)}"` : '';  
 return `<td class="${cls}"${titleAttr}${tdStyle}>${escHtml(disp)}</td>`;  
}  
  
function renderProductDaily(){  
 const rows = sortedProductDailyRows();  
 let html = productDailySummaryTableHtml_();  
 html += '<div class="grid-top-sum"><span class="sum-total" id="productDailyTopSum"></span><span class="count" id="productDailyTopCount"></span></div>';  
 html += '<div class="grid-wrap"><table><thead><tr>' + flagHeaderHtml('productdaily');  
 PRODUCT_DAILY_HEADERS.forEach(h => html += headerCellProductDaily(h));  
 html += '</tr></thead><tbody>';  
 rows.forEach(row => {  
 const rowCls = ((row._syncError ? 'sync-error' : (row._unsynced ? 'unsynced' : '')) + flagRowClass('productdaily', row.id)).trim();  
 html += `<tr data-id="${row.id}" class="${rowCls}">` + flagCellHtml('productdaily', row.id);  
 PRODUCT_DAILY_HEADERS.forEach(h => {  
 if (PRODUCT_DAILY_AUTO_FIELDS.includes(h)) {  
 const disp = commaFmt(row[h]);  
 const autoCls = ('auto money' + (productDailySortState.key === h ? ' sort-col' : '')).trim();  
 html += `<td class="${autoCls}" style="font-weight:bold; color:blue;">${escHtml(disp)}</td>`;  
 } else html += fieldCellHtmlProductDaily(row, h, rows);  
 });  
 html += '</tr>';  
 });  
 html += '</tbody></table></div>';  
 document.getElementById('content').innerHTML = html;  
 document.getElementById('productDailyRowCount').innerText = `총 ${rows.length}건`;  
 document.getElementById('productDailyTopCount').innerText = `총 ${rows.length}건`;  
 document.getElementById('productDailyTopSum').innerText = flaggedSumText_(rows, '합계');  
 fitGridWrapToViewport_();  
}  
  
  
function onRestartFieldChange(id, field, value){  
 const row = RESTART_ROWS.find(r => r.id === id);  
 if (!row) return;  
 row[field] = value;  
 row._unsynced = true; row._syncError = false;  
 renderRestart();  
 pushSaveRestart(row);  
}  
function pushSaveRestart(row){  
 setSyncStatus('saving');  
 const fields = {};  
 RESTART_EDITABLE_FIELDS.forEach(f => fields[f] = row[f] !== undefined ? row[f] : '');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) { row._unsynced = false; row._syncError = false; setSyncStatus('ok'); onDataChanged_('restart'); }  
 else { row._syncError = true; setSyncStatus('error', res && res.error); handleSessionExpiry(res); }  
 renderRestart();  
 })  
 .withFailureHandler(function(err){ row._syncError = true; setSyncStatus('error', err); renderRestart(); })  
 .saveRestartRow(SESSION.token, { id: row.id, fields: fields });  
}  
function retrySaveRestart(id){ const row = RESTART_ROWS.find(r => r.id === id); if (row) pushSaveRestart(row); }  
  
function deleteRestartGridRow(id){  
 if (!confirm('이 건을 삭제하시겠습니까? 삭제하면 복구할 수 없습니다.')) return;  
 const idx = RESTART_ROWS.findIndex(r => r.id === id);  
 if (idx === -1) return;  
 const removed = RESTART_ROWS[idx];  
 RESTART_ROWS.splice(idx, 1);  
 renderRestart();  
 setSyncStatus('saving');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) setSyncStatus('ok');  
 else { RESTART_ROWS.splice(idx, 0, removed); setSyncStatus('error', res && res.error); renderRestart(); alert('삭제 실패: ' + (res && res.error ? res.error : '알 수 없는 오류')); }  
 })  
 .withFailureHandler(function(err){ RESTART_ROWS.splice(idx, 0, removed); setSyncStatus('error', err); renderRestart(); alert('삭제 실패: ' + err); })  
 .deleteRestartRow(SESSION.token, id);  
}

 if (row.재개시일 !== '미정' && row.재개시일 && row.중지일 && row.재개시일 <= row.중지일) { setRestartError('재개시일','중지일 이후 날짜만 가능합니다.'); ok = false; }  
 if (row.공사담당 && row.공사담당.length > 10) { setRestartError('공사담당','10자 이내로 입력하세요.'); ok = false; }  
 return ok;

var statusYearMonth = todayStr().slice(0, 7);  
var statusProductFilter = '일반알람';  
let STATUS_DATA = null;  
let STATUS_TARGET = null;  
let STATUS_ACTUAL = null;  
let STATUS_REP_TARGETS = null; // 필터(일반알람/알람+휴엔/정보보안) 기준 담당자별 개인 목표(부여된 값 반영)  
const REP_TARGET_FIELD_ = { 수주: '목표_수주금액', 개시: '목표_개시금액', 유지감소: '목표_유지감소', 유지증가: '목표_유지증가' };  
function repTargetFor_(rep, key) {  
 const t = STATUS_REP_TARGETS && STATUS_REP_TARGETS[rep];  
 return t ? (Number(t[REP_TARGET_FIELD_[key]]) || 0) : 0;  
}  
  
function fmtK(v){  
 const n = Number(v) || 0;  
 return Math.round(n).toLocaleString('ko-KR');  
}  
function shiftMonth(delta){  
 const [y, m] = statusYearMonth.split('-').map(Number);  
 const d = new Date(y, m - 1 + delta, 1);  
 statusYearMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');  
 loadSalesStatus();  
}  
function onStatusFilterChange(sel){  
 statusProductFilter = sel.value;  
 loadSalesStatus();  
}  
  
function applySalesStatusResult_(res){  
 STATUS_DATA = res.rows;

 STATUS_ACTUAL = res.actual;  
 STATUS_REP_METRICS = res.repMetrics; // 차트용 데이터 수신  
 STATUS_REP_TARGETS = res.repTargets; // 담당자별 부여된 개인 목표(비율 배분 반영)

}

 if (!overlay || !body) return;  
 overlay.classList.add('open');  
 if (SALES_STATUS_LATEST_) {  
 renderSalesStatusPopupBody_(SALES_STATUS_LATEST_); // 미리 불러와둔 값이 있으면 그 자리에서 바로 표시  
 } else {  
 body.innerHTML = '<div class="loading">불러오는 중...</div>';  
 }  
 const cacheKey = 'salesStatus|' + statusYearMonth + '|' + statusProductFilter;  
 const cached = cacheGet_(cacheKey, GRID_CACHE_TTL_MS_);  
 if (cached) { SALES_STATUS_LATEST_ = cached; renderSalesStatusPopupBody_(cached); return; }  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (!res || !res.success) {  
 if (!SALES_STATUS_LATEST_) body.innerHTML = '<div class="loading">조회 실패: ' + ((res && res.error) || '알 수 없는 오류') + '</div>';  
 return;

 renderSalesStatusPopupBody_(res);  
 })  
 .withFailureHandler(function(err){  
 if (!SALES_STATUS_LATEST_) body.innerHTML = '<div class="loading">조회 실패: ' + err + '</div>';  
 })

/** 떠있는 창(.float-win) 제목줄을 마우스로 눌러 끌면 창이 그 위치로 따라 움직인다. (Admin.html과 동일) */  
(function initFloatWinDrag_(){  
 let dragEl = null, offX = 0, offY = 0;  
 document.addEventListener('mousedown', function(e){  
 const bar = e.target.closest && e.target.closest('.float-win-title');  
 if (!bar) return;  
 const win = bar.closest('.float-win');  
 if (!win) return;  
 dragEl = win;  
 const rect = win.getBoundingClientRect();  
 offX = e.clientX - rect.left;  
 offY = e.clientY - rect.top;  
 win.style.right = 'auto';  
 win.style.left = rect.left + 'px';  
 win.style.top = rect.top + 'px';  
 e.preventDefault();  
 });  
 document.addEventListener('mousemove', function(e){  
 if (!dragEl) return;  
 const maxLeft = window.innerWidth - 60, maxTop = window.innerHeight - 40;  
 dragEl.style.left = Math.min(Math.max(0, e.clientX - offX), maxLeft) + 'px';  
 dragEl.style.top = Math.min(Math.max(0, e.clientY - offY), maxTop) + 'px';  
 });  
 document.addEventListener('mouseup', function(){ dragEl = null; });  
})();  
  
function loadSalesStatus(){  
 const cacheKey = 'salesStatus|' + statusYearMonth + '|' + statusProductFilter;  
 const cached = cacheGet_(cacheKey);  
 if (cached) { applySalesStatusResult_(cached); return; } // 이미 불러온 적 있는 월/필터면 서버 호출 없이 즉시 표시  
  
 showLoadingProgress_('content', '데이터를 불러오는 중입니다...', 'loadSalesStatus');  
 setLoadingCursor(true);  
 google.script.run  
 .withSuccessHandler(function(res){  
 setLoadingCursor(false);  
 if (res && res.error) { showLogin(res.error); return; }  
 if (!res || !res.success) { document.getElementById('content').innerHTML = '<div class="loading">데이터 로드 실패: ' + (res && res.error) + '</div>'; return; }  
 cacheSet_(cacheKey, res);  
 applySalesStatusResult_(res);  
 })  
 .withFailureHandler(function(err){ setLoadingCursor(false); document.getElementById('content').innerHTML = '<div class="loading">데이터 로드 실패: ' + err + '</div>'; })  
 .getSalesStatus(SESSION.token, statusYearMonth, statusProductFilter);  
}  
  
function pctVs_(actual, base){  
 const a = Number(actual) || 0, b = Number(base) || 0;  
 if (b === 0) return '-';  
 return Math.round((a / b) * 100) + '%';  
}  
function diffVs_(actual, base){  
 const a = Number(actual) || 0, b = Number(base) || 0;  
 return fmtK(a - b);  
}  
function statusSummaryTableHtml(t, actual){  
 t = t || {}; actual = actual || {};  
 const cols = [

 { key:'개시', 목표:t.목표_개시금액, 계획:t.계획_개시금액, 실적:actual.개시 },  
 { key:'유지감소', 목표:t.목표_유지감소, 계획:t.계획_유지감소, 실적:actual.유지감소 },  
 { key:'유지증가', 목표:t.목표_유지증가, 계획:t.계획_유지증가, 실적:actual.유지증가 }  
 ];  
 const row = (cells) => cells.map(c => `<td class="num">${c}</td>`).join('');  
 return `  
 <table class="status-summary status-summary-full">

 <tbody>  
 <tr class="row-target"><th>목표</th>${row(cols.map(c => fmtK(c.목표)))}</tr>  
 <tr class="row-plan"><th>계획</th>${row(cols.map(c => fmtK(c.계획)))}</tr>  
 <tr class="row-actual"><th>실적</th>${row(cols.map(c => fmtK(c.실적)))}</tr>  
 <tr class="row-ratio"><th>(목표비)</th>${row(cols.map(c => pctVs_(c.실적, c.목표)))}</tr>

 <tr class="row-diff"><th>차이</th>${row(cols.map(c => diffVs_(c.실적, c.계획)))}</tr>  
 </tbody>  
 </table>`;  
}  
  
function renderSalesStatus(){  
 const [y, m] = statusYearMonth.split('-').map(Number);  
 const rows = STATUS_DATA || [];  
 const filterOptions = ['일반알람', '알람+휴엔', '정보보안'];  
  
 // 영업컨설턴트별 차트 HTML 생성 로직  
 const reps = REP_TARGET_LIST;  
  
 // 컨설턴트별 고정 컬러 (차트 종류와 상관없이 항상 동일 인물 = 동일 색상)  
 const REP_COLORS = { '최영국': '#2563eb', '이수열': '#16a34a', '박광춘': '#8b4513', '정문재': '#7c3aed', '임영민': '#f97316' };  
  
 // 값이 목표 대비 100%를 넘으면, 실제 최대값을 넘는 다음 100 단위까지 축을 유동적으로 확장 (예: 230% -> 300%, 310% -> 400%)  
 function gaugeAxisMax_(pctList) {  
 const maxAbs = Math.max(0, ...pctList.map(p => Math.abs(p)));  
 return maxAbs <= 100 ? 100 : Math.ceil(maxAbs / 100) * 100;  
 }  
  
 // 달성률은 지사 목표를 인원수로 균등 분배한 값이 아니라, "컨설턴트별 목표 입력" 탭에서 부여한  
 // 개인별 목표(repTargetFor_)를 그대로 사용한다(담당자마다 값이 다를 수 있음).  
 const gaugeMetrics = [  
 { key: '수주' },  
 { key: '개시' },  
 { key: '유지감소' }  
 ];  
  
 let chartHtml = '<div class="chart-grid">';  
  
 // 1) 수주/개시/유지감소: 컨설턴트별 색상 게이지 + 100% 초과 시 축 자동 확장 (담당자별로 부여된 개인 목표 사용)  
 gaugeMetrics.forEach(m => {  
 const pctList = reps.map(rep => {  
 const val = (STATUS_REP_METRICS && STATUS_REP_METRICS[rep] && STATUS_REP_METRICS[rep][m.key]) || 0;  
 const tgt = repTargetFor_(rep, m.key);  
 return tgt !== 0 ? (val / tgt) * 100 : 0;  
 });  
 const axisMax = gaugeAxisMax_(pctList);  
 const targetSum = reps.reduce((s, rep) => s + repTargetFor_(rep, m.key), 0);  
  
 chartHtml += `<div class="chart-card">  
 <div class="chart-card-title"><span>${m.key}</span> <span style="font-weight:normal; color:#888;">목표(개인 합계): ${fmtK(targetSum)}${axisMax > 100 ? ` (0~${axisMax}% 표시)` : ''}</span></div>`;  
 reps.forEach((rep, idx) => {  
 const val = (STATUS_REP_METRICS && STATUS_REP_METRICS[rep] && STATUS_REP_METRICS[rep][m.key]) || 0;  
 const tgt = repTargetFor_(rep, m.key);  
 const pct = Math.round(pctList[idx]);  
 const barWidth = Math.min(Math.max((pct / axisMax) * 100, 0), 100);  
 const color = REP_COLORS[rep] || '#888';  
  
 chartHtml += `<div class="bar-row" title="실적: ${fmtK(val)} / 목표: ${fmtK(tgt)}">  
 <div class="bar-name">${rep}</div>  
 <div class="bar-track"><div class="bar-fill" style="width: ${barWidth}%; background: ${color};"></div></div>  
 <div class="bar-pct">${pct}%</div>  
 </div>`;  
 });  
 chartHtml += `</div>`;  
 });  
  
 // 2) 유지증가: 0을 중심에 두고 양수는 오른쪽/음수는 왼쪽으로 뻗는 발산형 차트. 음수는 채도를 낮춰 양수와 구분. (담당자별 개인 목표 사용)  
 {  
 const incPctList = reps.map(rep => {  
 const val = (STATUS_REP_METRICS && STATUS_REP_METRICS[rep] && STATUS_REP_METRICS[rep]['유지증가']) || 0;  
 const tgt = repTargetFor_(rep, '유지증가');  
 return tgt !== 0 ? (val / tgt) * 100 : 0;  
 });  
 const incAxisMax = gaugeAxisMax_(incPctList);  
 const incTargetSum = reps.reduce((s, rep) => s + repTargetFor_(rep, '유지증가'), 0);  
  
 chartHtml += `<div class="chart-card">  
 <div class="chart-card-title"><span>유지증가</span> <span style="font-weight:normal; color:#888;">목표(개인 합계): ${fmtK(incTargetSum)}${incAxisMax > 100 ? ` (0~±${incAxisMax}% 표시)` : ''}</span></div>`;  
 reps.forEach((rep, idx) => {  
 const val = (STATUS_REP_METRICS && STATUS_REP_METRICS[rep] && STATUS_REP_METRICS[rep]['유지증가']) || 0;  
 const tgt = repTargetFor_(rep, '유지증가');  
 const pct = Math.round(incPctList[idx]);  
 const half = Math.min(Math.abs(pct) / incAxisMax * 50, 50);  
 const color = REP_COLORS[rep] || '#888';  
 const isNeg = pct < 0;  
 const fillStyle = isNeg  
 ? `left: ${(50 - half)}%; width: ${half}%; background: ${color}; filter: saturate(35%);`  
 : `left: 50%; width: ${half}%; background: ${color};`;  
  
 chartHtml += `<div class="bar-row" title="실적: ${fmtK(val)} / 목표: ${fmtK(tgt)}">  
 <div class="bar-name">${rep}</div>  
 <div class="bar-track bipolar"><span class="zero-line"></span><div class="bar-fill bipolar-fill" style="${fillStyle}"></div></div>  
 <div class="bar-pct">${pct}%</div>  
 </div>`;  
 });  
 chartHtml += `</div>`;  
 }  
  
 chartHtml += '</div>';  
  
 let html = `

 <div class="status-head">

function scrollSalesStatusToToday_(){

    if (gridWrap) {

      const theadH = thead ? thead.offsetHeight : 60;
      const rowTop = todayRow.offsetTop;
      const visibleH = gridWrap.clientHeight - theadH;
      const targetScroll = Math.max(0, rowTop - theadH - Math.max(20, Math.floor(visibleH * 0.25)));

      gridWrap.scrollTo({
        top: targetScroll,
        behavior: 'smooth'
      });
    }

    if (gridWrap) {
      const rect = gridWrap.getBoundingClientRect();
      if (rect.top > window.innerHeight - 120) {
        gridWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }, 120);

/** 통합 TEXT 보고(직접수정 가능 박스) 생성: 1~4 상품군은 자동집계 실적, 5~6은 안전상품/AI도어캠 실적 데이터를 사용.  
 * User.html은 조회 전용이라 전망/마감 모두 실제 자동집계 데이터를 그대로 사용함(예상치 입력 기능 없음). */  
function buildFullDailyReportText(mode){  
 const modeLabel = fullReportModeLabel_(mode);  
 const forecastOrders = (mode === '전망') ? DAILY_FORECAST_ORDERS : null;  
 const parts = String(dailyReportDate).split('-');  
 const month = Number(parts[1]) || 0, day = Number(parts[2]) || 0;  
 const lines = [];  
 lines.push('[북서울지사] ' + month + '月 ' + day + '日 ' + modeLabel);  
 lines.push('');  
 DAILY_REPORT_SECTIONS.forEach(function(sec){  
 const it = effectiveDailyItem(sec.product, forecastOrders);  
 lines.push(sec.heading);  
 DAILY_REPORT_METRICS.forEach(function(m){  
 const target = Math.round(Number(it['목표_' + m.key]) || 0);  
 const today = Math.round(Number(it[m.key + '_당일']) || 0);  
 const prev = Number(it[m.key + '_전일누계']) || 0;  
 const cum = Math.round(prev + today);  
 const rate = target ? Math.round((cum / target) * 100) : 0;  
   
// [수정] sec.product가 '알람'이고 m.key가 '수주'일 때만 (도전비 10%UP) 적용  
 const extraLabel = (sec.product === '알람' && m.key === '수주') ? ' (도전비 10%UP)' : '';  
   
lines.push('□ ' + m.label + ' * 목표 ' + fmtK(target) + '천원' + extraLabel);  
 lines.push('- 당일 : ' + fmtK(today) + '천원 / 누계 : ' + fmtK(cum) + '천원(' + rate + '%)');  
 });  
 lines.push('');  
 });  
 FULL_REPORT_EXTRA_SECTIONS.forEach(function(sec){  
 lines.push(sec.heading);  
 if (sec.groupKey === '안전상품') {  
 // 안전상품은 상품일보 기반 자동집계(SAFETY_SUMMARY_DAILY)만 유지되며, 예전 수동입력 시트(EXTRA_PRODUCT_DATA)는 더 이상 갱신되지 않아  
 // 그 값을 그대로 쓰면 항상 0으로 나온다. 또한 이 값은 "당일" 구분 없이 월 누계(자력 기준)만 제공된다.  
 // 목표는 전체(자력+전략협력) 목표이며 자력 목표는 그 절반이므로, 자력 실적은 목표의 50%를 기준으로 달성률을 계산한다.  
 const s = SAFETY_SUMMARY_DAILY || {};  
 const tgt = s.목표 || {}, act = s.실적 || {};  
 sec.metrics.forEach(function(m){  
 const target = Math.round(Number(tgt[m.key]) || 0);  
 const cum = Math.round(Number(act[m.key]) || 0);  
 const today = Math.round(Number(act[m.key + '_당일']) || 0);  
 const rate = target ? Math.round((cum / target) * 100) : 0;  
 lines.push('□ ' + m.label + ' * 목표 ' + fmtFullReportNum_(target, m.unit) + m.unit);  
 lines.push('- 당일 : ' + fmtFullReportNum_(today, m.unit) + m.unit + ' / 누계 : ' + fmtFullReportNum_(cum, m.unit) + m.unit + '(' + rate + '%)');  
 });  
 lines.push('');  
 return;  
 }  
 const group = (EXTRA_PRODUCT_DATA && EXTRA_PRODUCT_DATA[sec.groupKey]) || {};  
 sec.metrics.forEach(function(m){  
 const it = group[m.key] || {};  
 const target = Math.round(Number(it.목표) || 0);  
 const today = Math.round(Number(it.당일) || 0);  
 const prev = Number(it.전일누계) || 0;  
 const cum = Math.round(prev + today);  
 const rate = target ? Math.round((cum / target) * 100) : 0;  
 lines.push('□ ' + m.label + ' * 목표 ' + fmtFullReportNum_(target, m.unit) + m.unit);  
 lines.push('- 당일 : ' + fmtFullReportNum_(today, m.unit) + m.unit + ' / 누계 : ' + fmtFullReportNum_(cum, m.unit) + m.unit + '(' + rate + '%)');  
 });  
 lines.push('');  
 });  
 return lines.join('\n').replace(/\n+$/, '');  
}  
  
/** buildFullDailyReportText()의 결과에서 "- 당일 : ..." 실적 라인만 파란색으로 강조해 표시용 HTML을 만든다. */  
function buildFullDailyReportHtml_(mode){  
 const text = buildFullDailyReportText(mode);  
 // "- 당일 : 200천원 / 누계 : 2,691천원(72%)" 형식의 줄에서 당일 금액만 파란색 볼드,  
 // 누계 금액+달성률만 빨간색 볼드로 강조하고 나머지(레이블/기호)는 검정 일반체로 남긴다.  
 const m2 = /^(- 당일\s*:\s*)(.+?)(\s*\/\s*누계\s*:\s*)(.+?)(\([-\d]+%\))$/;  
 return text.split('\n').map(function(line){  
 const m = line.match(m2);  
 if (m) {  
 return escHtml(m[1]) +

 const mode = (sel && sel.value) || FULL_REPORT_MODE || defaultFullReportMode_();  
 FULL_REPORT_MODE = mode;

function copyReportText_(id){  
 try {  
 const el = document.getElementById(id);  
 if (!el) return;  
 const isTextarea = el.tagName === 'TEXTAREA';  
 const text = isTextarea ? el.value : el.innerText;  
 if (navigator.clipboard && navigator.clipboard.writeText) {  
 navigator.clipboard.writeText(text).catch(function(){});  
 return;  
 }  
 if (isTextarea) {  
 el.focus();  
 el.select();  
 } else {  
 const range = document.createRange();  
 range.selectNodeContents(el);  
 const sel = window.getSelection();  
 sel.removeAllRanges();  
 sel.addRange(range);  
 }  
 document.execCommand('copy');  
 } catch (e) { /* 클립보드 접근 실패는 무시 */ }  
}

function normalizeCellForOutput_(td) {  
 const select = td.querySelector('select');  
 if (select) {  
 const opt = select.options[select.selectedIndex];  
 td.textContent = opt ? opt.textContent : '';  
 return;  
 }  
 // 달력 아이콘 버튼, 숨은 date input, datalist 등 편집용 요소 제거

 if (input) {  
 td.textContent = input.value || '';  
 return;  
 }  
}

 { key:'영업담당', label:'영업담당', align:'center' },  
 { key:'담당차량', label:'담당차량', align:'center' },  
 { key:'보고일', label:'보고일', align:'center', date:true },  
 { key:'계약일', label:'계약일', align:'center', date:true },  
 { key:'개시일', label:'개시일', align:'center', date:true, highlight:'green' },  
 { key:'기산일', label:'기산일', align:'center', date:true, highlight:'yellow' },  
 { key:'용역료', label:'용역료', align:'right', money:true },  
 { key:'상품', label:'상품1', align:'center' }  
 ]  
};  
const IMG_EXPORT_TITLE_ = { order: '에스원 북서울지사 수주개시 현황' };  
const IMG_EXPORT_ROWS_ = { order: function(){ return sortedRows(); } };  
  
let GRID_IMG_PREVIEW_DATAURL_ = '';  
let GRID_IMG_PREVIEW_NAME_ = 'export';  
  
/** 선택(깃발)된 행만 골라 첨부 이미지와 동일한 서식(헤더 파란색, 개시일 녹색, 기산일 노란색, 용역료 파란 글씨,  
 * 계약처명 옆에 비고를 빨간 굵은 글씨로 괄호 표기)의 표를 만들어 PNG로 캡처한다. */  
function exportGridToImage(scope){  
 const cols = IMG_EXPORT_COLUMNS_[scope];  
 const getRows = IMG_EXPORT_ROWS_[scope];  
 if (!cols || !getRows) return;  
  
 const flaggedRows = getRows().filter(r => FLAGGED_SET.has(r.id));  
 if (!flaggedRows.length) { alert('선택된(깃발이 체크된) 항목이 없습니다.'); return; }  
  
 const titleName = IMG_EXPORT_TITLE_[scope] || '';  
 const borderColor = '#2b3a55';  
 const headerBg = '#c9d5ea';  
 const yellowBg = '#ffff00';  
 const greenBg = '#d9ead3';  
  
 let tableHtml = '<table style="border-collapse:collapse; font-family:\'Malgun Gothic\',sans-serif; background:#ffffff;">';  
 tableHtml += '<thead><tr>';  
 cols.forEach(function(c){  
 const bg = (c.highlight === 'yellow') ? yellowBg : headerBg;  
 tableHtml += '<th style="border:1px solid ' + borderColor + '; background:' + bg + '; color:#1a1a2e; font-weight:700; font-size:15px; padding:10px 14px; white-space:nowrap;">' + escHtml(c.label) + '</th>';  
 });  
 tableHtml += '</tr></thead><tbody>';  
  
 flaggedRows.forEach(function(row){  
 tableHtml += '<tr>';  
 cols.forEach(function(c){  
 const raw = row[c.key];  
 let displayVal;  

      if (c.key === '계약처명') {
        displayVal = escHtml(raw || '');
        if (row.비고) displayVal += ' <span style="color:#c00000; font-weight:700;">(' + escHtml(row.비고) + ')</span>';
      } else if (c.money) {
        displayVal = commaFmt(raw);
      } else if (c.date) {
        displayVal = escHtml(fmtMD(raw));
      } else {
        displayVal = escHtml(raw != null ? raw : '');
      }
      let bg = '#ffffff';
      let color = '#222222';
      if (c.highlight === 'yellow') { bg = yellowBg; color = '#6b5b00'; }
      else if (c.highlight === 'green') { bg = greenBg; color = '#274e13'; }
      if (c.money) color = '#1155cc';
      tableHtml += '<td style="border:1px solid ' + borderColor + '; background:' + bg + '; color:' + color + '; text-align:' + c.align + '; font-weight:' + (c.highlight || c.money ? '700' : '500') + '; font-size:14px; padding:9px 14px; white-space:nowrap;">' + displayVal + '</td>';
    });
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table>';

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; left:-99999px; top:0; padding:16px; background:#ffffff; display:inline-block;';
  container.innerHTML = tableHtml;
  document.body.appendChild(container);

  ensureImgExportLibReady_(function(){
    html2canvas(container, { backgroundColor: '#ffffff', scale: 2 }).then(function(canvas){
      if (container.parentNode) document.body.removeChild(container);
      GRID_IMG_PREVIEW_DATAURL_ = canvas.toDataURL('image/png');
      GRID_IMG_PREVIEW_NAME_ = (titleName || 'export').replace(/\s+/g, '_');
      document.getElementById('gridImgPreviewTitle').innerText = titleName + ' - 선택 ' + flaggedRows.length + '건';
      document.getElementById('gridImgPreviewImg').src = GRID_IMG_PREVIEW_DATAURL_;
      document.getElementById('gridImgPreviewOverlay').classList.add('open');
    }).catch(function(err){
      if (container.parentNode) document.body.removeChild(container);
      alert('이미지 생성 실패: ' + err);
    });
  });
}
function closeGridImgPreview_(){ document.getElementById('gridImgPreviewOverlay').classList.remove('open'); }
function downloadGridImgPreview_(){
  if (!GRID_IMG_PREVIEW_DATAURL_) return;
  const a = document.createElement('a');
  a.href = GRID_IMG_PREVIEW_DATAURL_;
  a.download = GRID_IMG_PREVIEW_NAME_ + '_' + todayStr() + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ===================== 영업보고 제출 (일반 사용자: 제출만 가능) ===================== */
function openAiReportModal_(){
  document.getElementById('aiReportInput').value = '';
  document.getElementById('aiReportResult').innerHTML = '';
  document.getElementById('aiReportModalOverlay').classList.add('open');
}
function closeAiReportModal_(){
  document.getElementById('aiReportModalOverlay').classList.remove('open');
}

function aiReportSubmit_(){
  const el = document.getElementById('aiReportInput');
  const text = (el.value || '').trim();
  if (!text) { alert('내용을 입력해주세요.'); return; }
  showLoadingProgress_('aiReportResult', '제출 중입니다...');
  setLoadingCursor(true);
  google.script.run
    .withSuccessHandler(function(res){
      setLoadingCursor(false);
      if (!res || !res.success) { document.getElementById('aiReportResult').innerHTML = '<div class="denied">제출 실패: ' + escHtml((res && res.error) || '알 수 없는 오류') + '</div>'; return; }
      el.value = '';
      document.getElementById('aiReportResult').innerHTML = '<div style="color:#2e7d32; font-size:13px;">제출되었습니다. 마스터 확인 후 등록됩니다.</div>';
      setTimeout(closeAiReportModal_, 1200);
    })
    .withFailureHandler(function(err){ setLoadingCursor(false); document.getElementById('aiReportResult').innerHTML = '<div class="denied">제출 실패: ' + escHtml(String(err)) + '</div>'; })
    .submitAiReportMessage(SESSION.token, text);
}

/* ===================== 가중지 정보(CS 직무 전용) ===================== */
let GAJUNGJI_ROWS_ = [];
function openGaJungjiModal_(){
  document.getElementById('gaJungjiInput').value = '';
  document.getElementById('gaJungjiPreview').innerHTML = '';
  document.getElementById('gaJungjiResult').innerHTML = '';
  GAJUNGJI_ROWS_ = [];
  document.getElementById('gaJungjiModalOverlay').classList.add('open');
}
function closeGaJungjiModal_(){
  document.getElementById('gaJungjiModalOverlay').classList.remove('open');
}
function gaJungjiAnalyze_(){
  const text = (document.getElementById('gaJungjiInput').value || '').trim();
  const prevEl = document.getElementById('gaJungjiPreview');
  if (!text) { prevEl.innerHTML = ''; GAJUNGJI_ROWS_ = []; return; }
  prevEl.innerHTML = '<div style="color:#999; font-size:12px;">분석 중...</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if (!res || !res.success) { prevEl.innerHTML = '<div class="denied">' + escHtml((res && res.error) || '표를 인식하지 못했습니다.') + '</div>'; GAJUNGJI_ROWS_ = []; return; }
      GAJUNGJI_ROWS_ = res.rows || [];
      renderGaJungjiPreview_();
    })
    .withFailureHandler(function(err){ prevEl.innerHTML = '<div class="denied">분석 실패: ' + escHtml(String(err)) + '</div>'; GAJUNGJI_ROWS_ = []; })
    .parseGaJungjiText(SESSION.token, text);
}
function renderGaJungjiPreview_(){
  const cols = ['차량','계약번호','고객서비스번호','계약처명','등록일','만료일','O/D','용역료','구분','일보등록','복구예정','대응자','담당영업','내용'];
  const prevEl = document.getElementById('gaJungjiPreview');
  if (!GAJUNGJI_ROWS_.length) { prevEl.innerHTML = ''; return; }
  let totalAmt = 0;
  const bodyRows = GAJUNGJI_ROWS_.map(function(r){
    const d = r.display;
    totalAmt += Number(String(d.용역료 || '').replace(/[^0-9]/g,'')) || 0;
    const badge = r.alreadyRegistered ? '<span style="color:#c0392b;">이미등록</span>' : '';
    return '<tr>' + cols.map(function(c){ return '<td style="padding:4px 6px; border:1px solid #e2e6ea; font-size:12px; white-space:nowrap;">' + escHtml(d[c] || '') + '</td>'; }).join('') +
      '<td style="padding:4px 6px; border:1px solid #e2e6ea; font-size:11px; white-space:nowrap;">' + badge + '</td></tr>';
  }).join('');
  prevEl.innerHTML =
    '<div style="font-weight:600; margin:10px 0 4px;">□ 일시/경비중지 일일 현황</div>' +
    '<table style="border-collapse:collapse; width:100%;"><thead><tr>' +
      cols.map(function(c){ return '<th style="padding:4px 6px; border:1px solid #e2e6ea; background:#eef4ff; font-size:12px;">' + escHtml(c) + '</th>'; }).join('') +
      '<th style="padding:4px 6px; border:1px solid #e2e6ea; background:#eef4ff; font-size:12px;"></th>' +
    '</tr></thead><tbody>' + bodyRows +
    '<tr><td colspan="7" style="padding:4px 6px; border:1px solid #e2e6ea; text-align:center; font-weight:600;">총 ' + GAJUNGJI_ROWS_.length + '건</td>' +
    '<td style="padding:4px 6px; border:1px solid #e2e6ea; font-weight:600;">' + totalAmt.toLocaleString() + '원</td>' +
    '<td colspan="7" style="border:1px solid #e2e6ea;"></td></tr>' +
    '</tbody></table>' +
    '<div style="color:#c0392b; font-size:11px; margin-top:6px;">"이미등록" 표시가 있는 행은 이미 정식 등록되었다는 의미로, 마스터 확인 시 자동등록 대상에서 제외됩니다.</div>';
}
function gaJungjiSubmit_(){
  const text = (document.getElementById('gaJungjiInput').value || '').trim();
  if (!text) { alert('내용을 입력해주세요.'); return; }
  if (!GAJUNGJI_ROWS_.length) {
    const prevEl = document.getElementById('gaJungjiPreview');
    prevEl.innerHTML = '<div style="color:#999; font-size:12px;">분석 중...</div>';
    google.script.run
      .withSuccessHandler(function(res){
        if (!res || !res.success) { prevEl.innerHTML = '<div class="denied">' + escHtml((res && res.error) || '표를 인식하지 못했습니다.') + '</div>'; return; }
        GAJUNGJI_ROWS_ = res.rows || [];
        renderGaJungjiPreview_();
        gaJungjiDoSubmit_();
      })
      .withFailureHandler(function(err){ prevEl.innerHTML = '<div class="denied">분석 실패: ' + escHtml(String(err)) + '</div>'; })
      .parseGaJungjiText(SESSION.token, text);
    return;
  }
  gaJungjiDoSubmit_();
}
function gaJungjiDoSubmit_(){
  const text = (document.getElementById('gaJungjiInput').value || '').trim();
  showLoadingProgress_('gaJungjiResult', '제출 중입니다...');
  setLoadingCursor(true);
  google.script.run
    .withSuccessHandler(function(res){
      setLoadingCursor(false);
      if (!res || !res.success) { document.getElementById('gaJungjiResult').innerHTML = '<div class="denied">제출 실패: ' + escHtml((res && res.error) || '알 수 없는 오류') + '</div>'; return; }
      document.getElementById('gaJungjiResult').innerHTML = '<div style="color:#2e7d32; font-size:13px;">제출되었습니다. 마스터 확인 후 해약중지로 등록됩니다.</div>';
      setTimeout(closeGaJungjiModal_, 1200);
    })
    .withFailureHandler(function(err){ setLoadingCursor(false); document.getElementById('gaJungjiResult').innerHTML = '<div class="denied">제출 실패: ' + escHtml(String(err)) + '</div>'; })
    .submitGaJungjiMessage(SESSION.token, text);
}

function renderLoggedInUser_(name, role){
  const whoEl = document.getElementById('whoami');
  if (!whoEl) return;
  whoEl.style.display = '';
  whoEl.innerText = name || '';
  
  let fontColor = '#ffffff';
  if (role === '메인마스터' || role === '서브마스터') {
    fontColor = '#ff4d4f'; // 빨강색 폰트 (마스터/서브마스터)
  } else if (role === '수정가능') {
    fontColor = '#60a5fa'; // 파랑색 폰트 (수정가능자)
  } else if (role === '읽기전용') {
    fontColor = '#4ade80'; // 초록색 폰트 (읽기전용사용자)
  }
  whoEl.style.color = fontColor;
  whoEl.style.fontWeight = '700';
  whoEl.style.fontSize = '14px';
  whoEl.style.marginRight = '12px';
}

// 숫자/금액 입력창 포커스 시 '0'을 포함한 전체 텍스트 자동 선택 (타이핑 시 즉시 덮어쓰기)
document.addEventListener('focus', function(e){
  const t = e.target;
  if (!t || t.tagName !== 'INPUT') return;
  if (t.classList.contains('money-in') || t.getAttribute('inputmode') === 'numeric') {
    setTimeout(function(){
      try { t.select(); } catch(err){}
    }, 15);
  }
}, true);

document.addEventListener('mouseup', function(e){
  const t = e.target;
  if (!t || t.tagName !== 'INPUT') return;
  if (t.classList.contains('money-in') || t.getAttribute('inputmode') === 'numeric') {
    if (!t.dataset.focusedOnce) {
      t.dataset.focusedOnce = '1';
      setTimeout(function(){
        try { t.select(); } catch(err){}
      }, 15);
    }
  }
}, true);

document.addEventListener('blur', function(e){
  const t = e.target;
  if (t && t.tagName === 'INPUT') {
    delete t.dataset.focusedOnce;
  }
}, true);
</script>
